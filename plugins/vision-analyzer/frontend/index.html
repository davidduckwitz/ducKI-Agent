<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vision Analyzer</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#e8edf5;height:100vh}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #252a36;background:#11141b}.top select,.top button{background:#171b24;color:#e8edf5;border:1px solid #303747;border-radius:8px;padding:8px 10px}.top button{cursor:pointer}.live{font-size:12px;color:#7f8a9d}.live.on{color:#5ee6a8}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}.viewer{position:relative;display:flex;align-items:center;justify-content:center;background:#050608;overflow:hidden}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.empty{color:#737d90}.side{overflow:auto;border-left:1px solid #252a36;padding:14px;background:#0f1218}.card{padding:12px;border:1px solid #262c38;border-radius:10px;background:#141820;margin-bottom:10px}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8f9bb0;margin:0 0 8px}.item{font-size:13px;padding:4px 0;border-bottom:1px solid #222733}.item:last-child{border:0}.footer{padding:8px 14px;border-top:1px solid #252a36;font-size:12px;color:#7f8a9d;display:flex;gap:18px}.accent{color:#71b7ff}.error{color:#ff8585;white-space:pre-wrap}.desc{white-space:pre-wrap;font-size:13px;line-height:1.45}</style>
</head>
<body><div class="app">
<div class="top"><strong>👁 Vision Analyzer</strong><select id="sessions"><option>Browser-Sessions laden …</option></select><button id="refresh">Aktualisieren</button><button id="scan">Frame analysieren</button><span id="live" class="live">● offline</span></div>
<div class="main"><div class="viewer" id="viewer"><span class="empty">Browser-Session auswählen</span><img id="frame" hidden><canvas id="overlay"></canvas></div><aside class="side"><div class="card"><h3>Scene</h3><div id="scene">–</div></div><div class="card"><h3>Objects / People</h3><div id="objects">–</div></div><div class="card"><h3>Text</h3><div id="text">–</div></div><div class="card"><h3>QR Codes</h3><div id="qr">–</div></div><div class="card"><h3>Description</h3><div id="description" class="desc">–</div></div><div id="error" class="error"></div></aside></div>
<div class="footer"><span id="fps">Frames: 0</span><span id="last">Noch kein Frame</span><span>QR: Browser BarcodeDetector</span></div>
</div><script src="app.js"></script></body></html>

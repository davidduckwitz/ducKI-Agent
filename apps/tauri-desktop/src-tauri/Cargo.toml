[package]
name = "ducki-desktop"
version = "1.0.2"
description = "DucKI Node Desktop Application"
authors = ["David Duckwitz"]
license = "UNLICENSED"
repository = ""
default-run = "ducki-desktop"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2.6"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.6"
tauri-plugin-log = "2.10"
tauri-plugin-updater = "2"
log = "0.4"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "z"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

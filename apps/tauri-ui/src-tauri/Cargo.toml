[package]
name = "ducki-ui"
version = "0.1.0"
description = "DucKI UI - Desktop client for the DucKI agent (web UI as standalone exe)"
authors = ["David Duckwitz"]
license = ""
repository = ""
default-run = "ducki-ui"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.0", features = ["custom-protocol"] }
tauri-plugin-shell = "2.0"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "z"

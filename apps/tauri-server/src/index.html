<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DucKI Node</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        color-scheme: dark;
        background: #080b14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
          "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      :root[data-theme="light"] body {
        background: #f8fafc;
      }

      :root[data-theme="light"] #app {
        background:
          radial-gradient(circle at 20% 0%, rgba(255, 106, 17, 0.12), transparent 45%),
          linear-gradient(145deg, #f8fafc 0%, #e2e8f0 100%);
      }

      :root[data-theme="light"] .loading {
        color: #0f172a;
      }

      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
          radial-gradient(circle at 20% 0%, rgba(255, 106, 17, 0.12), transparent 45%),
          linear-gradient(145deg, #080b14 0%, #0d1424 100%);
      }

      .loading {
        text-align: center;
        color: #f8fafc;
      }

      .loading h1 {
        font-size: 2.5em;
        margin: 0 0 0.5em 0;
        color: #ff6a11;
      }

      .loading p {
        font-size: 1.2em;
        margin: 0;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <h1>🦆 DucKI Server</h1>
        <p id="status">Starting server...</p>
        <p style="font-size: 0.9em; opacity: 0.7; margin-top: 1em;" id="port"></p>
      </div>
    </div>
    <script type="module">
      import { appDataDir } from 'https://cdn.skypack.dev/@tauri-apps/api/path';
      import { invoke } from 'https://cdn.skypack.dev/@tauri-apps/api/tauri';

      // Fallback for offline mode
      const statusEl = document.getElementById('status');
      const portEl = document.getElementById('port');

      // Update status periodically
      setInterval(async () => {
        try {
          const port = await invoke('get_backend_port');
          portEl.textContent = `Running on localhost:${port}`;
          statusEl.textContent = '✓ Backend ready!';
        } catch (e) {
          statusEl.textContent = 'Starting backend...';
        }
      }, 500);
    </script>
  </body>
</html>

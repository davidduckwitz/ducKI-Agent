[package]
name = "ducki-desktop"
version = "0.1.0"
description = "DucKI Node Desktop Application"
authors = ["David Duckwitz"]
license = ""
repository = ""
default-run = "ducki-desktop"
edition = "2021"
rust-version = "1.60"
build = "src-tauri/build.rs"

[[bin]]
name = "ducki-desktop"
path = "src-tauri/src-tauri-src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.0", features = ["custom-protocol"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "z"

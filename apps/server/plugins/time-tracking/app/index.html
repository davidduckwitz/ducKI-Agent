<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeiterfassung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0f; --surface: #141419; --surface-2: #1b1b22; --surface-3: #22222b;
    --border: #292932; --border-strong: #383842; --text: #f4f4f5; --text-secondary: #d4d4d8; --muted: #a1a1aa;
    --primary: #14b8a6; --primary-hover: #2dd4bf; --primary-soft: rgba(20, 184, 166, .16);
    --danger: #ef4444; --shadow: 0 15px 50px rgba(0, 0, 0, .35); --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  .app { width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px 24px 40px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-icon { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #fff; font-size: 21px; background: linear-gradient(135deg, #14b8a6, #2dd4bf); box-shadow: 0 8px 25px rgba(20, 184, 166, .35); flex-shrink: 0; }
  .brand-text h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.03em; }
  .brand-text p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }

  .timer-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .timer-display { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 140px; }
  .timer-display.running { color: var(--primary); }
  .timer-controls { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
  .form-control { min-height: 40px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); color: var(--text); }
  select.form-control { min-width: 160px; }
  input.note { flex: 1; min-width: 160px; }
  .primary-button { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--primary); background: var(--primary); color: #04211c; font-weight: 700; }
  .primary-button:hover { background: var(--primary-hover); }
  .danger-button { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--danger); background: rgba(239,68,68,.12); color: var(--danger); font-weight: 700; }
  .secondary-button { min-height: 38px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .section-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 20px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .del-btn { border: 0; background: transparent; color: var(--muted); font-size: 12px; }
  .del-btn:hover { color: var(--danger); }
  .running-badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 700; }

  .inline-form { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .inline-form input { flex: 1; min-width: 140px; }
  .inline-form input.rate { flex: 0 0 100px; }

  .toast-container { position: fixed; right: 20px; bottom: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
  .toast { min-width: 220px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">⏱️</div>
      <div class="brand-text"><h1>Zeiterfassung</h1><p>Projekte, Timer &amp; Wochenberichte</p></div>
    </div>
  </header>

  <div class="timer-card">
    <div class="timer-display" id="timerDisplay">00:00:00</div>
    <div class="timer-controls">
      <select class="form-control" id="timerProject"></select>
      <input type="text" class="form-control note" id="timerNote" placeholder="Notiz (optional)" />
      <button type="button" class="primary-button" id="startBtn">▶ Start</button>
      <button type="button" class="danger-button" id="stopBtn" style="display:none">■ Stop</button>
    </div>
  </div>

  <div class="section-head"><h2>Projekte</h2></div>
  <div class="card">
    <div class="inline-form">
      <input type="text" class="form-control" id="projName" placeholder="Projektname" />
      <input type="number" class="form-control rate" id="projRate" placeholder="€/h" />
      <button type="button" class="primary-button" id="addProjectBtn">+ Projekt</button>
    </div>
    <table><thead><tr><th>Name</th><th>Stundensatz</th></tr></thead><tbody id="projectRows"></tbody></table>
  </div>

  <div class="section-head"><h2>Einträge</h2></div>
  <div class="card">
    <table><thead><tr><th>Projekt</th><th>Start</th><th>Ende</th><th>Stunden</th><th>Notiz</th><th></th></tr></thead><tbody id="entryRows"></tbody></table>
  </div>

  <div class="section-head">
    <h2>Wochenbericht</h2>
    <div style="display:flex;gap:6px">
      <button type="button" class="secondary-button" id="prevWeekBtn">←</button>
      <button type="button" class="secondary-button" id="thisWeekBtn">Diese Woche</button>
      <button type="button" class="secondary-button" id="nextWeekBtn">→</button>
    </div>
  </div>
  <div class="card">
    <table><thead><tr><th>Projekt</th><th>Stunden</th><th>Stundensatz</th><th>Betrag</th></tr></thead><tbody id="reportRows"></tbody></table>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const toastContainer = document.getElementById("toastContainer");
  function showToast(message) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;
    toastContainer.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 3000);
  }

  async function invoke(input) {
    const res = await fetch("/api/plugins/time-tracking/invoke", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool: "time_tracking", input })
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((json && (json.error || json.message)) || ("HTTP " + res.status));
    const payload = (json.data && json.data.result) || json.result || {};
    if (payload.error) throw new Error(payload.error);
    return payload;
  }

  let projects = [];
  let projectsById = new Map();
  let runningEntry = null;
  let tickTimer = null;

  function formatHMS(ms) {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
    const s = String(totalSec % 60).padStart(2, "0");
    return h + ":" + m + ":" + s;
  }

  function tick() {
    const display = document.getElementById("timerDisplay");
    if (runningEntry) {
      display.textContent = formatHMS(Date.now() - new Date(runningEntry.started_at).getTime());
      display.classList.add("running");
    } else {
      display.textContent = "00:00:00";
      display.classList.remove("running");
    }
  }

  async function loadProjects() {
    const res = await invoke({ action: "list_projects" });
    projects = res.projects || [];
    projectsById = new Map(projects.map((p) => [p.id, p]));
    document.getElementById("timerProject").innerHTML = projects.map((p) => '<option value="' + p.id + '">' + p.name + "</option>").join("");
    document.getElementById("projectRows").innerHTML = projects.map((p) =>
      "<tr><td>" + p.name + "</td><td>" + (p.hourly_rate != null ? p.hourly_rate + " €/h" : "-") + "</td></tr>"
    ).join("") || '<tr><td colspan="2" style="color:var(--muted)">Noch keine Projekte.</td></tr>';
  }

  async function loadEntries() {
    const res = await invoke({ action: "list_entries" });
    const entries = res.entries || [];
    runningEntry = entries.find((e) => e.running) || null;
    document.getElementById("startBtn").style.display = runningEntry ? "none" : "";
    document.getElementById("stopBtn").style.display = runningEntry ? "" : "none";
    if (tickTimer) clearInterval(tickTimer);
    tick();
    if (runningEntry) tickTimer = setInterval(tick, 1000);

    document.getElementById("entryRows").innerHTML = entries.map((e) => {
      const project = projectsById.get(e.project_id);
      return "<tr><td>" + (project ? project.name : "#" + e.project_id) + "</td>" +
        "<td>" + new Date(e.started_at).toLocaleString("de-DE") + "</td>" +
        "<td>" + (e.ended_at ? new Date(e.ended_at).toLocaleString("de-DE") : '<span class="running-badge">läuft</span>') + "</td>" +
        "<td>" + (e.hours != null ? e.hours.toFixed(2) : "-") + "</td>" +
        "<td>" + (e.note || "") + "</td>" +
        '<td><button type="button" class="del-btn" data-del="' + e.id + '">✕</button></td></tr>';
    }).join("") || '<tr><td colspan="6" style="color:var(--muted)">Noch keine Einträge.</td></tr>';

    document.querySelectorAll("[data-del]").forEach((btn) => {
      btn.addEventListener("click", async () => { await invoke({ action: "delete_entry", id: Number(btn.dataset.del) }); await loadEntries(); });
    });
  }

  document.getElementById("addProjectBtn").addEventListener("click", async () => {
    const name = document.getElementById("projName").value.trim();
    if (!name) return showToast("Bitte einen Namen eingeben.");
    const hourly_rate = Number(document.getElementById("projRate").value) || undefined;
    await invoke({ action: "add_project", name, hourly_rate });
    document.getElementById("projName").value = "";
    document.getElementById("projRate").value = "";
    await loadProjects();
  });

  document.getElementById("startBtn").addEventListener("click", async () => {
    const project_id = Number(document.getElementById("timerProject").value);
    if (!project_id) return showToast("Bitte zuerst ein Projekt anlegen.");
    const note = document.getElementById("timerNote").value.trim() || undefined;
    await invoke({ action: "start_timer", project_id, note });
    await loadEntries();
  });

  document.getElementById("stopBtn").addEventListener("click", async () => {
    await invoke({ action: "stop_timer" });
    document.getElementById("timerNote").value = "";
    await loadEntries();
  });

  // Week report
  function mondayOf(date) {
    const d = new Date(date);
    const day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    return d.toISOString().slice(0, 10);
  }
  function addDays(dateStr, n) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  let weekStart = mondayOf(new Date());

  async function loadReport() {
    const res = await invoke({ action: "week_report", start_date: weekStart });
    document.getElementById("reportRows").innerHTML = res.report.map((r) =>
      "<tr><td>" + r.project_name + "</td><td>" + r.hours + "</td><td>" + (r.hourly_rate || 0) + " €/h</td><td>" + r.amount.toFixed(2) + " €</td></tr>"
    ).join("") || '<tr><td colspan="4" style="color:var(--muted)">Für diese Woche noch keine erfassten Stunden.</td></tr>';
  }
  document.getElementById("prevWeekBtn").addEventListener("click", () => { weekStart = addDays(weekStart, -7); loadReport(); });
  document.getElementById("nextWeekBtn").addEventListener("click", () => { weekStart = addDays(weekStart, 7); loadReport(); });
  document.getElementById("thisWeekBtn").addEventListener("click", () => { weekStart = mondayOf(new Date()); loadReport(); });

  await loadProjects();
  await loadEntries();
  await loadReport();
});
</script>
</body>
</html>

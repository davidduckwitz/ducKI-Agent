<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dokumente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0f; --surface: #141419; --surface-2: #1b1b22; --surface-3: #22222b;
    --border: #292932; --border-strong: #383842; --text: #f4f4f5; --text-secondary: #d4d4d8; --muted: #a1a1aa;
    --primary: #06b6d4; --primary-hover: #22d3ee; --primary-soft: rgba(6, 182, 212, .16);
    --danger: #ef4444; --shadow: 0 15px 50px rgba(0, 0, 0, .35); --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .app { width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px 24px 40px; }
  @media print { .no-print { display: none !important; } .app { max-width: 100%; padding: 0; } body { background: #fff; color: #000; } }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-icon { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #fff; font-size: 21px; background: linear-gradient(135deg, #06b6d4, #22d3ee); box-shadow: 0 8px 25px rgba(6, 182, 212, .35); flex-shrink: 0; }
  .brand-text h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.03em; }
  .brand-text p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; width: fit-content; }
  .tab { min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; }
  .tab.active { background: var(--primary-soft); color: var(--primary); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .primary-button { min-height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--primary); background: var(--primary); color: #04292f; font-weight: 700; }
  .primary-button:hover { background: var(--primary-hover); }
  .secondary-button { min-height: 38px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .secondary-button:hover { background: var(--surface-2); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .row-actions { display: flex; gap: 6px; }
  .mini-btn { min-height: 28px; padding: 0 8px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }

  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .form-control { display: block; width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); color: var(--text); }
  textarea.form-control { min-height: 160px; resize: vertical; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }

  .modal-backdrop { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.65); }
  .modal-backdrop.open { display: flex; }
  .modal { width: min(600px, 100%); max-height: 90vh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  #docView { display: none; }
  #docView.open { display: block; }
  .doc-body { background: #fff; color: #111; border-radius: 12px; padding: 40px; max-width: 700px; margin: 0 auto; }
  .doc-body h1, .doc-body h2, .doc-body h3 { margin-top: 0; }

  .toast-container { position: fixed; right: 20px; bottom: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
  .toast { min-width: 220px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar no-print">
    <div class="brand">
      <div class="brand-icon">📄</div>
      <div class="brand-text"><h1>Dokumente</h1><p>Vorlagen &amp; generierte Dokumente</p></div>
    </div>
  </header>

  <div id="listView" class="no-print">
    <div class="tabs">
      <button type="button" class="tab active" data-tab="templates">Vorlagen</button>
      <button type="button" class="tab" data-tab="documents">Dokumente</button>
    </div>

    <section id="templatesPane" class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0;font-size:15px">Vorlagen</h2>
        <button type="button" class="primary-button" id="newTemplateBtn">+ Vorlage</button>
      </div>
      <table><thead><tr><th>Name</th><th>Typ</th><th></th></tr></thead><tbody id="templateRows"></tbody></table>
    </section>

    <section id="documentsPane" class="card" style="display:none">
      <h2 style="margin:0 0 12px;font-size:15px">Generierte Dokumente</h2>
      <table><thead><tr><th>Name</th><th>Erstellt</th><th></th></tr></thead><tbody id="documentRows"></tbody></table>
    </section>
  </div>

  <div id="docView">
    <button type="button" class="secondary-button no-print" id="backBtn" style="margin-bottom:16px">← Zurück</button>
    <button type="button" class="primary-button no-print" id="printBtn" style="margin-bottom:16px;margin-left:8px">🖨 Drucken / Als PDF speichern</button>
    <div class="doc-body" id="docBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="templateModal"><div class="modal">
  <h3>Neue Vorlage</h3>
  <div class="form-group"><label>Name</label><input type="text" class="form-control" id="tName" /></div>
  <div class="form-group"><label>Typ</label><input type="text" class="form-control" id="tType" placeholder="Angebot, Vertrag, Report ..." /></div>
  <div class="form-group"><label>Markdown mit {{platzhaltern}}</label><textarea class="form-control" id="tBody" placeholder="# Angebot für {{kunde}}&#10;&#10;..."></textarea></div>
  <div class="modal-footer">
    <button type="button" class="secondary-button" id="cancelTemplate">Abbrechen</button>
    <button type="button" class="primary-button" id="saveTemplate">Speichern</button>
  </div>
</div></div>

<div class="modal-backdrop" id="generateModal"><div class="modal">
  <h3>Dokument generieren</h3>
  <div class="form-group"><label>Dokumentname</label><input type="text" class="form-control" id="gName" /></div>
  <div id="placeholderFields"></div>
  <div class="modal-footer">
    <button type="button" class="secondary-button" id="cancelGenerate">Abbrechen</button>
    <button type="button" class="primary-button" id="doGenerate">Generieren</button>
  </div>
</div></div>

<div class="toast-container no-print" id="toastContainer"></div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const toastContainer = document.getElementById("toastContainer");
  function showToast(message) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;
    toastContainer.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 3000);
  }

  async function invoke(input) {
    const res = await fetch("/api/plugins/docs-generator/invoke", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool: "docs_generator", input })
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((json && (json.error || json.message)) || ("HTTP " + res.status));
    const payload = (json.data && json.data.result) || json.result || {};
    if (payload.error) throw new Error(payload.error);
    return payload;
  }

  let templates = [];

  async function loadTemplates() {
    const res = await invoke({ action: "list_templates" });
    templates = res.templates || [];
    document.getElementById("templateRows").innerHTML = templates.map((t) =>
      "<tr><td>" + t.name + "</td><td>" + (t.type || "-") + '</td><td class="row-actions">' +
        '<button type="button" class="mini-btn" data-gen="' + t.id + '">Generieren</button>' +
        '<button type="button" class="mini-btn" data-del="' + t.id + '">Löschen</button>' +
      "</td></tr>"
    ).join("") || '<tr><td colspan="3" style="color:var(--muted)">Noch keine Vorlagen.</td></tr>';

    document.querySelectorAll("[data-gen]").forEach((btn) => btn.addEventListener("click", () => openGenerateModal(Number(btn.dataset.gen))));
    document.querySelectorAll("[data-del]").forEach((btn) => btn.addEventListener("click", async () => {
      await invoke({ action: "delete_template", id: Number(btn.dataset.del) });
      await loadTemplates();
    }));
  }

  async function loadDocuments() {
    const res = await invoke({ action: "list_documents" });
    document.getElementById("documentRows").innerHTML = (res.documents || []).map((d) =>
      "<tr><td>" + d.name + "</td><td>" + new Date(d.created_at).toLocaleString("de-DE") + '</td><td class="row-actions">' +
        '<button type="button" class="mini-btn" data-view="' + d.id + '">Ansehen</button>' +
        '<button type="button" class="mini-btn" data-deldoc="' + d.id + '">Löschen</button>' +
      "</td></tr>"
    ).join("") || '<tr><td colspan="3" style="color:var(--muted)">Noch keine Dokumente.</td></tr>';

    document.querySelectorAll("[data-view]").forEach((btn) => btn.addEventListener("click", () => viewDocument(Number(btn.dataset.view))));
    document.querySelectorAll("[data-deldoc]").forEach((btn) => btn.addEventListener("click", async () => {
      await invoke({ action: "delete_document", id: Number(btn.dataset.deldoc) });
      await loadDocuments();
    }));
  }

  async function viewDocument(id) {
    const doc = await invoke({ action: "get_document", id });
    document.getElementById("docBody").innerHTML = doc.rendered_html;
    document.getElementById("listView").style.display = "none";
    document.getElementById("docView").classList.add("open");
  }
  document.getElementById("backBtn").addEventListener("click", () => {
    document.getElementById("docView").classList.remove("open");
    document.getElementById("listView").style.display = "";
  });
  document.getElementById("printBtn").addEventListener("click", () => window.print());

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      const isTemplates = tab.dataset.tab === "templates";
      document.getElementById("templatesPane").style.display = isTemplates ? "" : "none";
      document.getElementById("documentsPane").style.display = isTemplates ? "none" : "";
      if (!isTemplates) loadDocuments();
    });
  });

  // Template modal
  const templateModal = document.getElementById("templateModal");
  document.getElementById("newTemplateBtn").addEventListener("click", () => {
    document.getElementById("tName").value = "";
    document.getElementById("tType").value = "";
    document.getElementById("tBody").value = "";
    templateModal.classList.add("open");
  });
  document.getElementById("cancelTemplate").addEventListener("click", () => templateModal.classList.remove("open"));
  document.getElementById("saveTemplate").addEventListener("click", async () => {
    const name = document.getElementById("tName").value.trim();
    const body_markdown = document.getElementById("tBody").value;
    if (!name || !body_markdown.trim()) return showToast("Bitte Name und Markdown-Text eingeben.");
    await invoke({ action: "add_template", name, type: document.getElementById("tType").value.trim() || undefined, body_markdown });
    templateModal.classList.remove("open");
    await loadTemplates();
  });

  // Generate modal
  const generateModal = document.getElementById("generateModal");
  let activeTemplate = null;
  function openGenerateModal(templateId) {
    activeTemplate = templates.find((t) => t.id === templateId);
    if (!activeTemplate) return;
    document.getElementById("gName").value = activeTemplate.name;
    const keys = [...new Set([...activeTemplate.body_markdown.matchAll(/\{\{\s*([\w.-]+)\s*\}\}/g)].map((m) => m[1]))];
    const fields = document.getElementById("placeholderFields");
    fields.innerHTML = keys.map((k) =>
      '<div class="form-group"><label>' + k + '</label><input type="text" class="form-control ph-input" data-key="' + k + '" /></div>'
    ).join("") || '<div style="color:var(--muted);font-size:12px">Diese Vorlage hat keine Platzhalter.</div>';
    generateModal.classList.add("open");
  }
  document.getElementById("cancelGenerate").addEventListener("click", () => generateModal.classList.remove("open"));
  document.getElementById("doGenerate").addEventListener("click", async () => {
    if (!activeTemplate) return;
    const data = {};
    document.querySelectorAll(".ph-input").forEach((input) => { data[input.dataset.key] = input.value; });
    const name = document.getElementById("gName").value.trim() || activeTemplate.name;
    await invoke({ action: "generate_document", template_id: activeTemplate.id, name, data });
    generateModal.classList.remove("open");
    showToast("Dokument erstellt.");
    document.querySelectorAll(".tab")[1].click();
  });

  await loadTemplates();
});
</script>
</body>
</html>

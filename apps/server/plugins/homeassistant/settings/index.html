<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home Assistant — Einstellungen</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 1.25rem; line-height: 1.5; }
  h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  p.hint { margin: 0 0 1rem; opacity: 0.75; font-size: 0.85rem; }
  label { display: block; margin: 0.9rem 0 0.3rem; font-weight: 600; font-size: 0.85rem; }
  input { width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  .row { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
  button { padding: 0.5rem 0.9rem; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .primary { background: #f97316; color: #fff; }
  .secondary { background: #8884; color: inherit; }
  #status { margin-top: 0.75rem; font-size: 0.85rem; min-height: 1.2em; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
</style>
</head>
<body>
  <h1>🏠 Home Assistant — Einstellungen</h1>
  <p class="hint">Basis-URL und Long-Lived Access Token deiner Home-Assistant-Instanz (Profil → Sicherheit → Langlebige Zugriffstoken erstellen).</p>

  <label for="base_url">Basis-URL</label>
  <input id="base_url" type="text" placeholder="http://homeassistant.local:8123" autocomplete="off" />

  <label for="access_token">Long-Lived Access Token</label>
  <input id="access_token" type="password" placeholder="•••••••• (unverändert lassen, um bestehendes Token zu behalten)" autocomplete="off" />

  <div class="row">
    <button class="primary" id="save">Speichern</button>
    <button class="secondary" id="test">Verbindung testen</button>
  </div>
  <div id="status"></div>

<script>
  const NAME = "homeassistant";
  const BASE = "/api/plugins/" + NAME;
  const $ = (id) => document.getElementById(id);
  const status = (msg, ok) => { const s = $("status"); s.textContent = msg || ""; s.className = ok ? "ok" : "err"; };

  async function load() {
    try {
      const res = await fetch(BASE + "/settings");
      const json = await res.json();
      const v = (json.data && json.data.values) || json.values || {};
      if (v.base_url) $("base_url").value = v.base_url;
      // access_token comes back masked ("***") when already set - leave the field empty
      // as a placeholder cue instead, so an accidental save doesn't overwrite it with "***".
      if (v.access_token) $("access_token").placeholder = "•••••••• (Token gesetzt — leer lassen zum Beibehalten)";
    } catch (e) { status("Konnte Einstellungen nicht laden: " + e.message, false); }
  }

  async function save() {
    const values = { base_url: $("base_url").value.trim() };
    const token = $("access_token").value.trim();
    if (token) values.access_token = token;
    try {
      const res = await fetch(BASE + "/settings", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ values })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((json && (json.error || json.message)) || ("HTTP " + res.status));
      $("access_token").value = "";
      status("Gespeichert.", true);
    } catch (e) { status("Speichern fehlgeschlagen: " + e.message, false); }
  }

  async function test() {
    status("Teste Verbindung ...", true);
    try {
      const res = await fetch(BASE + "/invoke", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tool: "homeassistant", input: { action: "ping" } })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((json && (json.error || json.message)) || ("HTTP " + res.status));
      const payload = (json.data && json.data.result) || json.result || {};
      if (payload.ok) status("✓ " + (payload.message || "Verbindung erfolgreich."), true);
      else status(payload.error || "Verbindung fehlgeschlagen.", false);
    } catch (e) { status("Verbindung fehlgeschlagen: " + e.message, false); }
  }

  $("save").onclick = save;
  $("test").onclick = test;
  load();
</script>
</body>
</html>

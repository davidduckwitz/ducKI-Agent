<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font:13px system-ui;color:#f4f4f5;background:transparent}body{margin:0}.box{padding:12px;border-radius:12px;background:#141419}.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #292932}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:1px solid #383842;background:#22222b;color:inherit;border-radius:7px;padding:5px 8px;cursor:pointer}.muted{color:#a1a1aa;font-size:12px}
</style><div class="box" id="app">Fernseher werden geladen …</div><script>
const base='/api/plugins/homeassistant/invoke';async function call(input){const r=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:'homeassistant',input})});const j=await r.json();return(j.data&&j.data.result)||j.result||{};}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function load(){try{const d=await call({action:'list_states',domain:'media_player'}),items=(d.entities||[]).filter(e=>e.device_class==='tv'||/(^| )(tv|fernseher|television)( |$)/i.test((e.friendly_name||'')+' '+e.entity_id));document.getElementById('app').innerHTML=items.length?items.slice(0,6).map(e=>'<div class="row"><span class="name">📺 '+esc(e.friendly_name)+'<br><span class="muted">'+esc(e.state)+'</span></span><button class="btn" data-a="media_play" data-id="'+esc(e.entity_id)+'">▶</button><button class="btn" data-a="media_pause" data-id="'+esc(e.entity_id)+'">Ⅱ</button><button class="btn" data-a="volume_mute" data-id="'+esc(e.entity_id)+'">🔇</button></div>').join(''):'<span class="muted">Keine Fernseher gefunden</span>';document.querySelectorAll('.btn').forEach(x=>x.onclick=async()=>{x.disabled=true;await call({action:'call_service',domain:'media_player',service:x.dataset.a,entity_id:x.dataset.id});load();});}catch(e){document.getElementById('app').textContent='Fernseher nicht verfügbar';}}load();setInterval(load,30000);
</script></html>

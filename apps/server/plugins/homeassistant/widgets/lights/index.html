<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font:13px system-ui;color:#f4f4f5;background:transparent}body{margin:0}.box{padding:10px;border-radius:12px;background:#141419}.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #292932}.row:last-child{border:0}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.switch{accent-color:#f97316}.muted{color:#a1a1aa;font-size:12px}
</style><div class="box" id="app">Lichter werden geladen …</div><script>
const base='/api/plugins/homeassistant/invoke';async function call(input){const r=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:'homeassistant',input})});const j=await r.json();return(j.data&&j.data.result)||j.result||{};}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function load(){try{const d=await call({action:'list_states',domain:'light'}),items=(d.entities||[]).slice(0,8);document.getElementById('app').innerHTML=items.length?items.map(e=>'<div class="row"><span class="name">💡 '+esc(e.friendly_name)+'</span><input class="switch" type="checkbox" '+(e.state==='on'?'checked':'')+' aria-label="'+esc(e.friendly_name)+'" data-id="'+esc(e.entity_id)+'"></div>').join(''):'<span class="muted">Keine Lichter gefunden</span>';document.querySelectorAll('input').forEach(x=>x.onchange=async()=>{x.disabled=true;await call({action:x.checked?'turn_on':'turn_off',entity_id:x.dataset.id});load();});}catch(e){document.getElementById('app').textContent='Lichter nicht verfügbar';}}load();setInterval(load,30000);
</script></html>

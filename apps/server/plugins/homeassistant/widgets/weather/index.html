<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font:14px system-ui;color:#f4f4f5;background:transparent}body{margin:0}.box{padding:12px;border-radius:12px;background:#141419}.muted{color:#a1a1aa;font-size:12px}.now{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}.temp{font-size:32px;font-weight:700}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{text-align:center;padding:7px 3px;background:#22222b;border-radius:8px;font-size:11px}.day b{display:block;font-size:13px;margin-top:4px}@media(max-width:500px){.days{grid-template-columns:repeat(4,1fr)}}
</style><div class="box" id="app">Wetter wird geladen …</div><script>
const base='/api/plugins/homeassistant/invoke';async function call(input){const r=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:'homeassistant',input})});const j=await r.json();return(j.data&&j.data.result)||j.result||{};}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function load(){try{const d=await call({action:'get_forecast'}),c=d.current||{},f=d.forecast||[];document.getElementById('app').innerHTML='<div class="muted">⛅ '+esc(d.location||'Wetter')+(d.stale?' · offline':'')+'</div><div class="now"><span class="temp">'+esc(c.temperature??'–')+' '+esc(c.unit||'°C')+'</span><span>'+esc(d.condition||'')+'</span></div><div class="days">'+f.map(x=>'<div class="day">'+esc((x.datetime||x.date||'').slice(5,10))+'<br>'+esc(x.condition||'')+'<b>'+esc(x.temperature??'–')+'°</b></div>').join('')+'</div>';}catch(e){document.getElementById('app').textContent='Wetter nicht verfügbar';}}load();setInterval(load,600000);
</script></html>

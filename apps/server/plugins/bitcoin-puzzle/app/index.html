<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0f; --surface: #14141a; --surface-2: #1b1b23; --surface-3: #23232d;
    --border: #292933; --border-strong: #3a3a46; --text: #f4f4f5; --text-secondary: #d4d4d8; --muted: #9c9ca6;
    --primary: #f7931a; --primary-hover: #ffab3d; --primary-soft: rgba(247, 147, 26, .16);
    --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --info: #60a5fa;
    --shadow: 0 12px 40px rgba(0, 0, 0, .3); --shadow-lg: 0 20px 60px rgba(0, 0, 0, .4); --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:
    radial-gradient(circle at 15% 0%, rgba(247,147,26,.06), transparent 45%), var(--bg); color: var(--text); }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .app { width: 100%; max-width: 1040px; margin: 0 auto; padding: 24px 24px 48px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 15px; color: #fff; font-size: 22px; background: linear-gradient(135deg, #f7931a, #ffab3d); box-shadow: 0 10px 28px rgba(247, 147, 26, .4); flex-shrink: 0; }
  .brand-text h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.03em; }
  .brand-text p { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); }
  .primary-button { min-height: 40px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--primary); background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #2b1400; font-weight: 700; box-shadow: 0 6px 18px rgba(247,147,26,.28); transition: transform .12s ease, box-shadow .12s ease; }
  .primary-button:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(247,147,26,.38); }
  .secondary-button { min-height: 36px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 12.5px; font-weight: 600; transition: background .12s ease, border-color .12s ease; }
  .secondary-button:hover { background: var(--surface-3); border-color: var(--border-strong); }
  .danger-button { min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(239,68,68,.35); background: rgba(239,68,68,.1); color: var(--danger); font-size: 12px; font-weight: 600; }
  .danger-button:hover { background: rgba(239,68,68,.18); }
  .ghost-button { border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .ghost-button:hover { color: var(--text); }

  .card { background: linear-gradient(180deg, var(--surface), var(--surface) 60%, var(--surface-2)); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
  .card-title { margin: 0 0 14px; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

  .form-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .form-control { display: block; width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); transition: border-color .12s ease, box-shadow .12s ease; }
  .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  textarea.form-control { min-height: 64px; resize: vertical; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }
  .mode-select-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .mode-chip { flex: 1; min-height: 54px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; padding: 6px; text-align: center; transition: all .12s ease; }
  .mode-chip .emoji { font-size: 17px; }
  .mode-chip.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .field-hint { font-size: 11px; color: var(--muted); margin: -6px 0 12px; }

  .puzzle-grid { display: flex; flex-direction: column; gap: 14px; }
  .puzzle-card { display: flex; flex-direction: column; gap: 12px; }
  .puzzle-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .puzzle-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .puzzle-title { font-weight: 700; font-size: 15.5px; }
  .puzzle-address { font-size: 11px; color: var(--muted); font-family: "SFMono-Regular", Consolas, monospace; word-break: break-all; margin-top: 3px; }
  .badge-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 700; white-space: nowrap; letter-spacing: .02em; }
  .status-running { background: rgba(34,197,94,.16); color: var(--success); }
  .status-paused { background: rgba(245,158,11,.16); color: var(--warning); }
  .status-idle { background: var(--surface-3); color: var(--muted); }
  .status-completed { background: rgba(34,197,94,.24); color: var(--success); }
  .status-error { background: rgba(239,68,68,.16); color: var(--danger); }
  .status-exhausted { background: rgba(96,165,250,.16); color: var(--info); }
  .mode-badge { background: var(--surface-3); color: var(--text-secondary); }

  .progress-bar { height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-hover)); border-radius: 999px; transition: width .4s ease; }
  .stats-row { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }
  .stats-row b { color: var(--text); font-variant-numeric: tabular-nums; }
  .rate-pill { font-size: 10px; font-weight: 700; color: var(--success); background: rgba(34,197,94,.14); padding: 2px 8px; border-radius: 999px; }

  .puzzle-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .found-banner { padding: 12px; border-radius: 11px; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.35); font-size: 12px; margin-bottom: 10px; }
  .found-banner .mnemonic { font-family: "SFMono-Regular", Consolas, monospace; word-break: break-word; margin-top: 4px; font-weight: 700; color: var(--success); }

  .detail-panel { margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--border); display: none; }
  .detail-panel.open { display: block; height: 440px; overflow-y: auto; }
  .detail-tabs { display: flex; gap: 4px; margin-bottom: 10px; background: var(--surface-2); border-radius: 9px; padding: 3px; width: fit-content; }
  .detail-tab { min-height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 600; font-size: 11.5px; }
  .detail-tab.active { background: var(--surface-3); color: var(--text); }
  .detail-section { display: none; }
  .detail-section.active { display: block; }

  .attempts-list { height: 160px; overflow-y: auto; font-size: 11px; font-family: "SFMono-Regular", Consolas, monospace; background: var(--surface-2); border-radius: 9px; padding: 8px; }
  .attempts-list div { padding: 2px 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inline-form { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .inline-form input { flex: 1; min-width: 160px; min-height: 34px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 12px; }

  .csv-table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table.csv-table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: "SFMono-Regular", Consolas, monospace; }
  table.csv-table th { text-align: left; padding: 7px 10px; background: var(--surface-3); color: var(--muted); font-family: "Inter", sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; position: sticky; top: 0; }
  table.csv-table td { padding: 5px 10px; border-top: 1px solid var(--border); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  table.csv-table tr:hover td { background: var(--surface-2); }
  .csv-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .csv-count { font-size: 11px; color: var(--muted); }

  .empty { padding: 44px 20px; text-align: center; color: var(--muted); }
  .empty .emoji { font-size: 30px; margin-bottom: 8px; }
  .toast-container { position: fixed; right: 20px; bottom: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
  .toast { min-width: 220px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🧩</div>
      <div class="brand-text"><h1>Bitcoin Puzzle</h1><p>Mnemonic-Suche gegen eine Zieladresse</p></div>
    </div>
    <a href="/api/plugins/bitcoin-puzzle/ui/settings" target="_blank" rel="noopener"><button type="button" class="secondary-button">⚙️ Einstellungen</button></a>
  </header>

  <section class="card">
    <h2 class="card-title">✨ Neues Puzzle</h2>

    <div class="mode-select-row" id="modeRow">
      <button type="button" class="mode-chip active" data-mode="random"><span class="emoji">🎲</span>Zufällig</button>
      <button type="button" class="mode-chip" data-mode="sequential"><span class="emoji">🔢</span>Systematisch</button>
      <button type="button" class="mode-chip" data-mode="partial"><span class="emoji">🧩</span>Lückentext</button>
    </div>
    <div class="field-hint" id="modeHint">Zufällige 12-Wort-Mnemonics — der klassische Modus, nie „fertig".</div>

    <div class="form-grid">
      <div class="form-group"><label>Zieladresse</label><input type="text" class="form-control" id="newAddress" placeholder="1..." /></div>
      <div class="form-group"><label>Name (optional)</label><input type="text" class="form-control" id="newName" placeholder="z. B. 0.005 BTC Level 5" /></div>
    </div>
    <div class="form-group"><label>Info-URL (optional)</label><input type="text" class="form-control" id="newInfoUrl" placeholder="https://..." /></div>

    <div class="form-group" id="templateGroup" style="display:none">
      <label>Bekannte Phrase mit Lücken (__ oder ?, max. 2)</label>
      <textarea class="form-control" id="newTemplate" placeholder="abandon ability __ actual admit adult advance afraid again age agent about"></textarea>
    </div>

    <button type="button" class="primary-button" id="createBtn">+ Puzzle erstellen</button>
  </section>

  <div class="puzzle-grid" id="puzzleList"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const toastContainer = document.getElementById("toastContainer");
  function showToast(message) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;
    toastContainer.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 3500);
  }

  async function invoke(input) {
    const res = await fetch("/api/plugins/bitcoin-puzzle/invoke", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool: "bitcoin_puzzle", input })
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((json && (json.error || json.message)) || ("HTTP " + res.status));
    const payload = (json.data && json.data.result) || json.result || {};
    if (payload.error) throw new Error(payload.error);
    return payload;
  }

  const STATUS_LABEL = { running: "Läuft", paused: "Pausiert", idle: "Inaktiv", completed: "Gelöst", error: "Fehler", exhausted: "Erschöpft" };
  const MODE_LABEL = { random: "🎲 Zufällig", sequential: "🔢 Systematisch", partial: "🧩 Lückentext" };
  const MODE_HINTS = {
    random: "Zufällige 12-Wort-Mnemonics — der klassische Modus, nie „fertig\".",
    sequential: "Systematischer, lückenloser Durchlauf durch den gesamten Entropieraum — fortsetzbar, deckt irgendwann wirklich alles ab.",
    partial: "Nur die Lücken in einer bekannten Phrase werden erschöpfend durchprobiert — endlicher, oft sehr viel kleinerer Suchraum.",
  };
  const openDetails = new Set();
  const openDetailTab = new Map(); // puzzleId -> "overview"|"csv"|"search"
  const csvPage = new Map(); // puzzleId -> { rows: [], offset: 0, hasMore: true }

  // Mode chip selector
  let selectedMode = "random";
  document.getElementById("modeRow").addEventListener("click", (e) => {
    const chip = e.target.closest(".mode-chip");
    if (!chip) return;
    selectedMode = chip.dataset.mode;
    document.querySelectorAll(".mode-chip").forEach((c) => c.classList.toggle("active", c === chip));
    document.getElementById("modeHint").textContent = MODE_HINTS[selectedMode];
    document.getElementById("templateGroup").style.display = selectedMode === "partial" ? "" : "none";
  });

  function progressPercent(p) {
    if (p.mode === "partial" && p.combinationProgress && p.combinationProgress.total > 0) {
      return Math.min(100, (p.combinationProgress.index / p.combinationProgress.total) * 100);
    }
    // random/sequential: no meaningful "done" fraction (search space is astronomical) - a
    // small, saturating bar just to show "something is happening".
    return Math.min(100, Math.log10(Math.max(1, p.generatedCount)) * 10);
  }

  function puzzleCard(p) {
    const card = document.createElement("div");
    card.className = "card puzzle-card";
    const isOpen = openDetails.has(p.id);
    const pct = progressPercent(p);
    const progressLabel = p.mode === "partial" && p.combinationProgress
      ? p.combinationProgress.index.toLocaleString("de-DE") + " / " + p.combinationProgress.total.toLocaleString("de-DE") + " (" + pct.toFixed(1) + "%)"
      : null;

    card.innerHTML =
      '<div class="puzzle-head">' +
        '<div><div class="puzzle-title-row"><span class="puzzle-title">' + p.name + '</span>' +
          '<span class="badge mode-badge">' + (MODE_LABEL[p.mode] || p.mode) + '</span></div>' +
          '<div class="puzzle-address">' + p.targetAddress + '</div></div>' +
        '<div class="badge-row">' +
          (p.isRunning ? '<span class="rate-pill">' + p.addressesPerSecond + '/Sek</span>' : '') +
          '<span class="badge status-' + p.status + '">' + (STATUS_LABEL[p.status] || p.status) + '</span>' +
        '</div>' +
      '</div>' +
      (p.found ? '<div class="found-banner">🎉 Gelöst! Mnemonic in den Details sichtbar.</div>' : '') +
      '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="stats-row">' +
        '<span>Generiert: <b>' + p.generatedCount.toLocaleString("de-DE") + '</b></span>' +
        '<span>Versucht: <b>' + p.triedCombinationsCount.toLocaleString("de-DE") + '</b></span>' +
        (progressLabel ? '<span>Fortschritt: <b>' + progressLabel + '</b></span>' : '') +
      '</div>' +
      '<div class="puzzle-actions">' +
        (p.status === "running" ? '<button type="button" class="secondary-button" data-pause="' + p.id + '">⏸ Pause</button>' : '') +
        (p.status === "paused" || p.status === "idle" ? '<button type="button" class="secondary-button" data-resume="' + p.id + '">▶ Weiter</button>' : '') +
        (p.status === "running" || p.status === "paused" ? '<button type="button" class="secondary-button" data-stop="' + p.id + '">■ Stop</button>' : '') +
        '<button type="button" class="secondary-button" data-details="' + p.id + '">' + (isOpen ? "Details ausblenden" : "🔍 Details") + '</button>' +
        '<button type="button" class="danger-button" data-delete="' + p.id + '">Löschen</button>' +
      '</div>' +
      '<div class="detail-panel' + (isOpen ? " open" : "") + '" id="detail-' + p.id + '"></div>';

    card.querySelector("[data-pause]")?.addEventListener("click", async () => { await invoke({ action: "pause", puzzleId: p.id }); loadPuzzles(); });
    card.querySelector("[data-resume]")?.addEventListener("click", async () => { await invoke({ action: "resume", puzzleId: p.id }); loadPuzzles(); });
    card.querySelector("[data-stop]")?.addEventListener("click", async () => { await invoke({ action: "stop", puzzleId: p.id }); loadPuzzles(); });
    card.querySelector("[data-delete]")?.addEventListener("click", async () => {
      if (!confirm('Puzzle "' + p.name + '" wirklich löschen? Das entfernt auch die gesamte Versuchshistorie unwiderruflich.')) return;
      await invoke({ action: "delete", puzzleId: p.id });
      openDetails.delete(p.id);
      loadPuzzles();
    });
    card.querySelector("[data-details]")?.addEventListener("click", async () => {
      if (openDetails.has(p.id)) { openDetails.delete(p.id); } else { openDetails.add(p.id); await renderDetail(p.id); }
      loadPuzzles();
    });

    return card;
  }

  function switchDetailTab(puzzleId, tab) {
    openDetailTab.set(puzzleId, tab);
    const detail = document.getElementById("detail-" + puzzleId);
    if (!detail) return;
    detail.querySelectorAll(".detail-tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === tab));
    detail.querySelectorAll(".detail-section").forEach((s) => s.classList.toggle("active", s.dataset.section === tab));
    if (tab === "csv") loadCsvPage(puzzleId, true);
  }

  async function loadCsvPage(puzzleId, reset) {
    const detail = document.getElementById("detail-" + puzzleId);
    if (!detail) return;
    let page = csvPage.get(puzzleId);
    if (reset || !page) { page = { rows: [], offset: 0, hasMore: true }; csvPage.set(puzzleId, page); }

    const res = await invoke({ action: "list_attempts", puzzleId, offset: page.offset, limit: 100 });
    page.rows = reset ? res.rows : page.rows.concat(res.rows);
    page.offset += res.count;
    page.hasMore = res.hasMore;
    page.total = res.total;

    const tbody = detail.querySelector(".csv-tbody");
    const countEl = detail.querySelector(".csv-count");
    const moreBtn = detail.querySelector(".csv-more-btn");
    if (!tbody) return;
    tbody.innerHTML = page.rows.map((r) =>
      "<tr><td>" + r.mnemonic + "</td><td>" + (r.address || "-") + "</td></tr>"
    ).join("") || '<tr><td colspan="2" style="color:var(--muted);font-family:Inter">Keine Einträge.</td></tr>';
    countEl.textContent = page.rows.length.toLocaleString("de-DE") + " geladen" + (page.total != null ? " von ~" + page.total.toLocaleString("de-DE") : "");
    moreBtn.style.display = page.hasMore ? "" : "none";
  }

  async function renderDetail(puzzleId) {
    const detail = document.getElementById("detail-" + puzzleId);
    if (!detail) return;
    const info = await invoke({ action: "get", puzzleId });
    const activeTab = openDetailTab.get(puzzleId) || "overview";

    const foundHtml = info.state.foundMnemonic
      ? '<div class="found-banner">🎉 <b>Mnemonic:</b><div class="mnemonic">' + info.state.foundMnemonic + '</div></div>'
      : "";
    const recentHtml = (info.recentAttempts || []).slice(-15).reverse().map((a) =>
      "<div>" + a.mnemonic.split(" ").slice(0, 4).join(" ") + "... → " + a.address + "</div>"
    ).join("") || '<div style="color:var(--muted)">Noch keine Versuche.</div>';

    detail.innerHTML =
      '<div class="detail-tabs">' +
        '<button type="button" class="detail-tab" data-tab="overview">Übersicht</button>' +
        '<button type="button" class="detail-tab" data-tab="csv">CSV ansehen</button>' +
        '<button type="button" class="detail-tab" data-tab="search">Suchen &amp; Markieren</button>' +
      '</div>' +

      '<div class="detail-section" data-section="overview">' +
        foundHtml +
        '<div style="font-size:11px;color:var(--muted);margin:0 0 4px">Letzte Versuche</div>' +
        '<div class="attempts-list">' + recentHtml + '</div>' +
      '</div>' +

      '<div class="detail-section" data-section="csv">' +
        '<div class="csv-toolbar"><span class="csv-count"></span><button type="button" class="secondary-button csv-export-btn">⬇ Geladene Zeilen exportieren</button></div>' +
        '<div class="csv-table-wrap"><table class="csv-table"><thead><tr><th>Mnemonic</th><th>Adresse</th></tr></thead><tbody class="csv-tbody"></tbody></table></div>' +
        '<button type="button" class="secondary-button csv-more-btn" style="margin-top:8px;width:100%">Mehr laden</button>' +
      '</div>' +

      '<div class="detail-section" data-section="search">' +
        '<div class="inline-form">' +
          '<input type="text" placeholder="Phrase markieren (__ als Platzhalter)" class="mark-phrase-input" />' +
          '<button type="button" class="secondary-button mark-phrase-btn">Markieren</button>' +
        '</div>' +
        '<div class="inline-form">' +
          '<input type="text" placeholder="Suche (Mnemonic-Teil oder Adresse)" class="search-input" />' +
          '<button type="button" class="secondary-button search-btn">Suchen</button>' +
        '</div>' +
        '<div class="search-results" style="margin-top:8px"></div>' +
      '</div>';

    detail.querySelectorAll(".detail-tab").forEach((tab) => {
      tab.addEventListener("click", () => switchDetailTab(puzzleId, tab.dataset.tab));
    });

    detail.querySelector(".mark-phrase-btn").addEventListener("click", async () => {
      const phrase = detail.querySelector(".mark-phrase-input").value.trim();
      if (!phrase) return;
      const res = await invoke({ action: "mark_phrase", puzzleId, phrase });
      showToast(res.generatedCount + " Phrase(n) markiert.");
      renderDetail(puzzleId);
    });

    detail.querySelector(".search-btn").addEventListener("click", async () => {
      const query = detail.querySelector(".search-input").value.trim();
      if (!query) return;
      const res = await invoke({ action: "search", puzzleId, query });
      const results = detail.querySelector(".search-results");
      results.innerHTML = '<div class="attempts-list">' +
        (res.matches.length ? res.matches.slice(0, 50).map((a) => "<div>" + a.mnemonic + " → " + a.address + "</div>").join("") : '<div style="color:var(--muted)">Keine Treffer.</div>') +
        "</div>";
    });

    detail.querySelector(".csv-more-btn").addEventListener("click", () => loadCsvPage(puzzleId, false));
    detail.querySelector(".csv-export-btn").addEventListener("click", () => {
      const page = csvPage.get(puzzleId);
      if (!page || !page.rows.length) return showToast("Erst die CSV-Ansicht öffnen und laden.");
      const lines = ["mnemonic,address", ...page.rows.map((r) => '"' + r.mnemonic.replace(/"/g, '""') + '","' + (r.address || "").replace(/"/g, '""') + '"')];
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = puzzleId + "-export.csv";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });

    switchDetailTab(puzzleId, activeTab);
  }

  let pollTimer = null;

  async function loadPuzzles() {
    try {
      const res = await invoke({ action: "list" });
      const container = document.getElementById("puzzleList");
      const scrollY = window.scrollY;
      container.innerHTML = "";
      if (!res.puzzles.length) {
        container.innerHTML = '<div class="card empty"><div class="emoji">🧩</div>Noch keine Puzzles. Erstelle oben eines.</div>';
      } else {
        res.puzzles.forEach((p) => container.appendChild(puzzleCard(p)));
        for (const id of openDetails) await renderDetail(id);
      }
      window.scrollTo(0, scrollY);
    } catch (error) {
      showToast("Laden fehlgeschlagen: " + error.message);
    }
  }

  document.getElementById("createBtn").addEventListener("click", async () => {
    const targetAddress = document.getElementById("newAddress").value.trim();
    if (!targetAddress) return showToast("Bitte eine Zieladresse eingeben.");
    const template = document.getElementById("newTemplate").value.trim();
    if (selectedMode === "partial" && !template) return showToast("Bitte eine Phrase mit Lücken (__ oder ?) eingeben.");
    try {
      await invoke({
        action: "create", targetAddress, mode: selectedMode,
        template: selectedMode === "partial" ? template : undefined,
        name: document.getElementById("newName").value.trim() || undefined,
        infoUrl: document.getElementById("newInfoUrl").value.trim() || undefined,
      });
      document.getElementById("newAddress").value = "";
      document.getElementById("newName").value = "";
      document.getElementById("newInfoUrl").value = "";
      document.getElementById("newTemplate").value = "";
      showToast("Puzzle erstellt.");
      loadPuzzles();
    } catch (error) {
      showToast("Fehlgeschlagen: " + error.message);
    }
  });

  await loadPuzzles();
  pollTimer = setInterval(loadPuzzles, 3000);
});
</script>
</body>
</html>

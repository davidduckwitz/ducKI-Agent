<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Analyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0f; --surface: #141419; --surface-2: #1b1b22; --surface-3: #22222b;
    --border: #292932; --border-strong: #383842; --text: #f4f4f5; --text-secondary: #d4d4d8; --muted: #a1a1aa;
    --primary: #ec4899; --primary-hover: #f472b6; --primary-soft: rgba(236, 72, 153, .16);
    --accent2: #8b5cf6; --danger: #ef4444; --success: #22c55e; --warn: #f59e0b;
    --shadow: 0 15px 50px rgba(0, 0, 0, .35); --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .app { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 24px 40px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-icon { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #fff; font-size: 21px; background: linear-gradient(135deg, #ec4899, #8b5cf6, #f59e0b); box-shadow: 0 8px 25px rgba(236, 72, 153, .35); flex-shrink: 0; }
  .brand-text h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.03em; }
  .brand-text p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }

  .primary-button { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--primary); background: var(--primary); color: #fff; font-weight: 700; white-space: nowrap; }
  .primary-button:hover { background: var(--primary-hover); }
  .primary-button:disabled { opacity: .55; cursor: not-allowed; }
  .secondary-button { min-height: 38px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .secondary-button:hover { border-color: var(--border-strong); }
  .danger-button { min-height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--danger); background: rgba(239,68,68,.12); color: var(--danger); font-weight: 600; font-size: 12px; }
  .ghost-button { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 4px 6px; border-radius: 6px; }
  .ghost-button:hover { color: var(--text); background: var(--surface-3); }
  .form-control { min-height: 40px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); color: var(--text); }
  select.form-control { min-width: 160px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 20px; }

  .project-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .project-bar select { flex: 0 0 auto; }

  .add-form { display: flex; flex-direction: column; gap: 10px; }
  .add-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-form-row input { flex: 1; min-width: 220px; }
  .add-form-hint { font-size: 11px; color: var(--muted); }
  .spinner { width: 15px; height: 15px; border-radius: 999px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; display: inline-block; animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: border-color .15s ease, transform .15s ease; display: flex; flex-direction: column; }
  .item-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
  .item-thumb { width: 100%; aspect-ratio: 16/10; background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .item-thumb .placeholder { font-size: 26px; opacity: .35; }
  .badge { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(4px); }
  .status-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .status-badge.ready { background: rgba(34,197,94,.2); color: var(--success); }
  .status-badge.processing { background: rgba(245,158,11,.2); color: var(--warn); }
  .status-badge.error { background: rgba(239,68,68,.2); color: var(--danger); }
  .item-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .item-title { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .item-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

  /* Detail modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 0; }
  .modal-head h2 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; }
  .modal-close { border: 0; background: var(--surface-3); color: var(--muted); width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0; }
  .modal-body { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-thumb { width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; background: var(--surface-2); }
  .modal-meta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .transcript-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--text-secondary); max-height: 140px; overflow-y: auto; white-space: pre-wrap; }
  .qa-list { display: flex; flex-direction: column; gap: 10px; }
  .qa-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .qa-q { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .qa-a { font-size: 12px; color: var(--text-secondary); white-space: pre-wrap; }
  .qa-a.error { color: var(--danger); }
  .ask-row { display: flex; gap: 8px; }
  .ask-row input { flex: 1; }
  .danger-row { display: flex; gap: 8px; padding-top: 4px; border-top: 1px solid var(--border); }

  .toast-container { position: fixed; right: 20px; bottom: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
  .toast { min-width: 220px; max-width: 340px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-size: 12px; }
  .toast.error { border-color: rgba(239,68,68,.4); color: #fecaca; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🎬</div>
      <div class="brand-text"><h1>Social Media Analyse</h1><p>Videos &amp; Bilder von URLs analysieren</p></div>
    </div>
    <button type="button" class="primary-button" id="newProjectBtn">+ Neues Projekt</button>
  </header>

  <div class="project-bar">
    <select class="form-control" id="projectSelect"></select>
    <button type="button" class="danger-button" id="deleteProjectBtn" title="Projekt löschen">Projekt löschen</button>
  </div>

  <div class="card">
    <div class="add-form">
      <div class="add-form-row">
        <input type="text" class="form-control" id="urlInput" placeholder="YouTube-, TikTok-, Instagram-, X-Link oder direkter Bild-/Video-Link…" />
      </div>
      <div class="add-form-row">
        <input type="text" class="form-control" id="questionInput" placeholder="Frage dazu (optional) – z. B. „Was passiert in diesem Video?“" />
        <button type="button" class="primary-button" id="addItemBtn">Analysieren</button>
      </div>
      <div class="add-form-hint" id="addHint">Kann bis zu einer Minute dauern (Download, Transkription, Bildanalyse).</div>
    </div>
  </div>

  <div id="itemsGrid" class="grid"></div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div id="modalRoot"></div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const toastContainer = document.getElementById("toastContainer");
  function showToast(message, isError) {
    const toast = document.createElement("div");
    toast.className = "toast" + (isError ? " error" : "");
    toast.textContent = message;
    toastContainer.appendChild(toast);
    setTimeout(function () { toast.remove(); }, isError ? 6000 : 3000);
  }

  async function invoke(input) {
    const res = await fetch("/api/plugins/social-media/invoke", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool: "social_media", input })
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((json && (json.error || json.message)) || ("HTTP " + res.status));
    const payload = (json.data && json.data.result) || json.result || {};
    if (payload.error) throw new Error(payload.error);
    return payload;
  }

  let projects = [];
  let currentProjectId = null;
  let items = [];

  function platformBadge(platform) {
    return platform || "Web";
  }

  async function loadProjects() {
    const res = await invoke({ action: "list_projects" });
    projects = res.projects || [];
    const select = document.getElementById("projectSelect");
    if (projects.length === 0) {
      select.innerHTML = '<option value="">Kein Projekt – zuerst eins anlegen</option>';
      currentProjectId = null;
      return;
    }
    if (!currentProjectId || !projects.some((p) => p.id === currentProjectId)) {
      currentProjectId = projects[0].id;
    }
    select.innerHTML = projects.map((p) => '<option value="' + p.id + '"' + (p.id === currentProjectId ? " selected" : "") + '>' + escapeHtml(p.name) + "</option>").join("");
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function loadItems() {
    const grid = document.getElementById("itemsGrid");
    if (!currentProjectId) {
      grid.innerHTML = '<div class="empty-state">Noch kein Projekt vorhanden. Leg oben eins an, um loszulegen.</div>';
      return;
    }
    const res = await invoke({ action: "list_items", project_id: currentProjectId });
    items = res.items || [];
    if (items.length === 0) {
      grid.innerHTML = '<div class="empty-state">Noch nichts analysiert. Füg oben eine URL hinzu.</div>';
      return;
    }
    grid.innerHTML = items.map((item) => {
      const thumb = item.thumbnail_data_url
        ? '<img src="' + item.thumbnail_data_url + '" alt="">'
        : '<span class="placeholder">' + (item.kind === "video" ? "🎬" : item.kind === "image" ? "🖼️" : "🔗") + "</span>";
      const statusLabel = item.status === "ready" ? "Fertig" : item.status === "processing" ? "Läuft…" : "Fehler";
      return (
        '<div class="item-card" data-id="' + item.id + '">' +
          '<div class="item-thumb">' + thumb +
            '<span class="badge">' + escapeHtml(platformBadge(item.platform)) + "</span>" +
            '<span class="status-badge ' + item.status + '">' + statusLabel + "</span>" +
          "</div>" +
          '<div class="item-body">' +
            '<div class="item-title">' + escapeHtml(item.title || item.source_url) + "</div>" +
            '<div class="item-meta"><span>' + (item.duration_sec ? Math.round(item.duration_sec) + "s" : "") + '</span><span>' + (item.has_video_file ? "📼" : "") + "</span></div>" +
          "</div>" +
        "</div>"
      );
    }).join("");

    grid.querySelectorAll(".item-card").forEach((card) => {
      card.addEventListener("click", () => openDetail(Number(card.dataset.id)));
    });
  }

  // ----- Detail modal -----
  async function openDetail(itemId) {
    const res = await invoke({ action: "get_item", id: itemId });
    renderDetail(res.item, res.questions || []);
  }

  function renderDetail(item, questions) {
    const root = document.getElementById("modalRoot");
    const qaHtml = questions.length
      ? questions.map((q) =>
          '<div class="qa-item"><div class="qa-q">' + escapeHtml(q.question) + '</div><div class="qa-a' + (q.status === "error" ? " error" : "") + '">' +
          escapeHtml(q.status === "error" ? (q.error || "Fehler") : (q.answer || "…")) + "</div></div>"
        ).join("")
      : '<div style="color:var(--muted);font-size:12px">Noch keine Fragen gestellt.</div>';

    root.innerHTML =
      '<div class="modal-backdrop" id="modalBackdrop">' +
        '<div class="modal">' +
          '<div class="modal-head"><h2>' + escapeHtml(item.title || item.source_url) + '</h2><button type="button" class="modal-close" id="modalCloseBtn">✕</button></div>' +
          '<div class="modal-body">' +
            (item.thumbnail_data_url ? '<img class="modal-thumb" src="' + item.thumbnail_data_url + '" alt="">' : "") +
            '<div class="modal-meta-row">' +
              '<span class="badge" style="position:static">' + escapeHtml(platformBadge(item.platform)) + "</span>" +
              (item.duration_sec ? "<span style=\"font-size:11px;color:var(--muted)\">" + Math.round(item.duration_sec) + "s</span>" : "") +
              '<a href="' + escapeHtml(item.source_url) + '" target="_blank" rel="noreferrer" style="font-size:11px;color:var(--muted)">Quelle öffnen ↗</a>' +
            "</div>" +
            (item.transcript ? '<div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">Transkript</div><div class="transcript-box">' + escapeHtml(item.transcript) + "</div></div>" : "") +
            '<div><div style="font-size:11px;color:var(--muted);margin-bottom:6px">Fragen &amp; Antworten</div><div class="qa-list" id="qaList">' + qaHtml + "</div></div>" +
            '<div class="ask-row"><input type="text" class="form-control" id="newQuestionInput" placeholder="Weitere Frage stellen…"><button type="button" class="primary-button" id="askBtn">Fragen</button></div>' +
            '<div class="danger-row">' +
              (item.has_video_file ? '<button type="button" class="danger-button" id="deleteVideoBtn">Video löschen</button>' : '<span style="font-size:11px;color:var(--muted)">Videodatei bereits gelöscht.</span>') +
              '<button type="button" class="danger-button" id="deleteItemBtn" style="margin-left:auto">Item löschen</button>' +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>";

    document.getElementById("modalCloseBtn").addEventListener("click", closeDetail);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") closeDetail(); });

    document.getElementById("askBtn").addEventListener("click", async () => {
      const input = document.getElementById("newQuestionInput");
      const question = input.value.trim();
      if (!question) return;
      const btn = document.getElementById("askBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Fragen';
      try {
        await invoke({ action: "ask_question", item_id: item.id, question });
        input.value = "";
        const refreshed = await invoke({ action: "get_item", id: item.id });
        renderDetail(refreshed.item, refreshed.questions || []);
      } catch (err) {
        showToast(err.message || String(err), true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Fragen";
      }
    });

    const deleteVideoBtn = document.getElementById("deleteVideoBtn");
    if (deleteVideoBtn) {
      deleteVideoBtn.addEventListener("click", async () => {
        if (!confirm("Videodatei löschen? Transkript, Frames und Fragen bleiben erhalten.")) return;
        await invoke({ action: "delete_video_file", id: item.id });
        const refreshed = await invoke({ action: "get_item", id: item.id });
        renderDetail(refreshed.item, refreshed.questions || []);
        await loadItems();
      });
    }

    document.getElementById("deleteItemBtn").addEventListener("click", async () => {
      if (!confirm("Dieses Item komplett löschen (inkl. Video, Transkript und Fragen)?")) return;
      await invoke({ action: "delete_item", id: item.id });
      closeDetail();
      await loadItems();
    });
  }

  function closeDetail() {
    document.getElementById("modalRoot").innerHTML = "";
  }

  // ----- Toolbar actions -----
  document.getElementById("projectSelect").addEventListener("change", async (e) => {
    currentProjectId = Number(e.target.value) || null;
    await loadItems();
  });

  document.getElementById("newProjectBtn").addEventListener("click", async () => {
    const name = prompt("Projektname:");
    if (!name || !name.trim()) return;
    const res = await invoke({ action: "add_project", name: name.trim() });
    currentProjectId = res.project.id;
    await loadProjects();
    await loadItems();
  });

  document.getElementById("deleteProjectBtn").addEventListener("click", async () => {
    if (!currentProjectId) return;
    if (!confirm("Dieses Projekt und ALLE enthaltenen Analysen (inkl. Videodateien) unwiderruflich löschen?")) return;
    await invoke({ action: "delete_project", id: currentProjectId });
    currentProjectId = null;
    await loadProjects();
    await loadItems();
  });

  document.getElementById("addItemBtn").addEventListener("click", async () => {
    const urlInput = document.getElementById("urlInput");
    const questionInput = document.getElementById("questionInput");
    const url = urlInput.value.trim();
    if (!url) return showToast("Bitte eine URL eingeben.", true);
    if (!currentProjectId) return showToast("Bitte zuerst ein Projekt anlegen.", true);
    const question = questionInput.value.trim() || undefined;

    const btn = document.getElementById("addItemBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Analysiere…';
    try {
      const res = await invoke({ action: "add_item", project_id: currentProjectId, url, question });
      if (res.item && res.item.status === "error") {
        showToast("Analyse fehlgeschlagen: " + (res.item.error || "unbekannter Fehler"), true);
      } else {
        showToast("Analyse abgeschlossen.");
      }
      urlInput.value = "";
      questionInput.value = "";
      await loadItems();
    } catch (err) {
      showToast(err.message || String(err), true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Analysieren";
    }
  });

  await loadProjects();
  await loadItems();
});
</script>
</body>
</html>

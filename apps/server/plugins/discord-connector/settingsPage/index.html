<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discord-Connector — Einstellungen</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 1.25rem; line-height: 1.5; }
  h1 { font-size: 1.1rem; margin: 0 0 0.75rem; }
  p.hint { margin: 0 0 1rem; opacity: 0.75; font-size: 0.85rem; }
  label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; font-size: 0.85rem; }
  input { width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; }
  .row { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
  button { padding: 0.5rem 0.9rem; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .primary { background: #5865F2; color: #fff; }
  .ghost { background: #8882; color: inherit; }
  #status { margin-top: 0.75rem; font-size: 0.85rem; min-height: 1.2em; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
  small { opacity: 0.7; }
  #liveStatus { margin: 0 0 1rem; padding: 0.5rem 0.75rem; border-radius: 6px; background: #8881; font-size: 0.85rem; }
  .dot { display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%; margin-right: 0.4em; background: #999; }
  .dot.active { background: #16a34a; }
  .dot.configured { background: #d97706; }
</style>
</head>
<body>
  <h1>Discord-Connector</h1>
  <p class="hint">Bot-Token aus dem Discord Developer Portal (Your App &gt; Bot &gt; Reset Token). Optional: Guild-/User-Filter und Public Key für Slash-Command-Interaktionen.</p>

  <div id="liveStatus"><span class="dot" id="statusDot"></span><span id="statusText">Status wird geladen…</span></div>

  <label for="name">Name <small>(Anzeigename dieser Konfiguration)</small></label>
  <input id="name" type="text" placeholder="Discord Gateway" autocomplete="off" />

  <label for="authToken">Discord Bot Token <small>(Secret — wird verschlüsselt gespeichert)</small></label>
  <input id="authToken" type="password" placeholder="•••• (leer lassen = unverändert / env DISCORD_BOT_TOKEN)" autocomplete="off" />

  <label for="channelHint">Discord Channel ID / Hint <small>(optional, Standard-Zielkanal)</small></label>
  <input id="channelHint" type="text" placeholder="z.B. 123456789012345678" autocomplete="off" />

  <label for="inboundLabel">Discord User Label / Name <small>(optional)</small></label>
  <input id="inboundLabel" type="text" placeholder="Anzeigename für eingehende Nachrichten" autocomplete="off" />

  <label for="guildId">Guild-ID <small>(optional)</small></label>
  <input id="guildId" type="text" placeholder="z.B. 123456789012345678" autocomplete="off" />

  <label for="userId">Erlaubte User-ID <small>(optional)</small></label>
  <input id="userId" type="text" placeholder="z.B. 123456789012345678" autocomplete="off" />

  <label for="appId">Discord Application ID <small>(optional)</small></label>
  <input id="appId" type="text" placeholder="Developer Portal > General Information" autocomplete="off" />

  <label for="publicKey">Discord Public Key <small>(optional, für Interactions-Webhook-Signaturprüfung)</small></label>
  <input id="publicKey" type="text" placeholder="Developer Portal > General Information" autocomplete="off" />

  <label for="metadata">Metadata <small>(optional, Freitext/JSON)</small></label>
  <input id="metadata" type="text" placeholder="" autocomplete="off" />

  <label for="webhookSecret">Discord Webhook URL / Secret <small>(Secret — Fallback-Outbound-Transport ohne Bot-Token)</small></label>
  <input id="webhookSecret" type="password" placeholder="•••• (leer lassen = unverändert)" autocomplete="off" />

  <div class="row">
    <button class="primary" id="save">Speichern</button>
    <button class="ghost" id="test">Verbindung testen</button>
  </div>
  <div id="status"></div>

<script>
  const NAME = "discord-connector";
  const BASE = "/api/plugins/" + NAME;
  const $ = (id) => document.getElementById(id);
  const status = (msg, ok) => { const s = $("status"); s.textContent = msg; s.className = ok ? "ok" : "err"; };

  async function loadLiveStatus() {
    try {
      const res = await fetch("/api/agents/live");
      const json = await res.json();
      const statuses = (json.data && json.data.connectorStatuses) || {};
      const s = statuses["discord"];
      const dot = $("statusDot"); const text = $("statusText");
      if (!s) { dot.className = "dot"; text.textContent = "Noch kein Status verfügbar."; return; }
      dot.className = "dot" + (s.active ? " active" : s.configured ? " configured" : "");
      text.textContent = s.active
        ? "Verbunden" + (s.connectedAt ? " seit " + new Date(s.connectedAt).toLocaleString() : "")
        : s.configured
          ? "Konfiguriert, aber nicht verbunden" + (s.lastError ? " — " + s.lastError : "")
          : "Nicht konfiguriert" + (s.lastError ? " — " + s.lastError : "");
    } catch (e) { $("statusText").textContent = "Status konnte nicht geladen werden."; }
  }

  async function load() {
    try {
      const res = await fetch(BASE + "/settings");
      const json = await res.json();
      const v = (json.data && json.data.values) || json.values || {};
      $("name").value = typeof v.name === "string" ? v.name : "";
      $("authToken").placeholder = v.authToken === "***" ? "•••• (gesetzt — leer lassen = unverändert)" : "•••• (leer lassen = unverändert / env DISCORD_BOT_TOKEN)";
      $("channelHint").value = typeof v.channelHint === "string" ? v.channelHint : "";
      $("inboundLabel").value = typeof v.inboundLabel === "string" ? v.inboundLabel : "";
      $("guildId").value = typeof v.guildId === "string" ? v.guildId : "";
      $("userId").value = typeof v.userId === "string" ? v.userId : "";
      $("appId").value = typeof v.appId === "string" ? v.appId : "";
      $("publicKey").value = typeof v.publicKey === "string" ? v.publicKey : "";
      $("metadata").value = typeof v.metadata === "string" ? v.metadata : "";
      $("webhookSecret").placeholder = v.webhookSecret === "***" ? "•••• (gesetzt — leer lassen = unverändert)" : "•••• (leer lassen = unverändert)";
    } catch (e) { status("Konnte Einstellungen nicht laden: " + e.message, false); }
  }

  async function save() {
    const values = {
      name: $("name").value.trim(),
      channelHint: $("channelHint").value.trim(),
      inboundLabel: $("inboundLabel").value.trim(),
      guildId: $("guildId").value.trim(),
      userId: $("userId").value.trim(),
      appId: $("appId").value.trim(),
      publicKey: $("publicKey").value.trim(),
      metadata: $("metadata").value.trim(),
    };
    if ($("authToken").value.trim()) values.authToken = $("authToken").value.trim();
    if ($("webhookSecret").value.trim()) values.webhookSecret = $("webhookSecret").value.trim();
    try {
      const res = await fetch(BASE + "/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ values }) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      await fetch(BASE + "/enable", { method: "POST" });
      status("Gespeichert.", true);
      $("authToken").value = "";
      $("webhookSecret").value = "";
      load();
      setTimeout(loadLiveStatus, 1500);
    } catch (e) { status("Speichern fehlgeschlagen: " + e.message, false); }
  }

  async function test() {
    status("Teste Verbindung…", true);
    try {
      const res = await fetch(BASE + "/connector/test", { method: "POST" });
      const json = await res.json();
      if (!res.ok || (json.data && json.data.ok === false)) {
        throw new Error((json.data && json.data.error) || json.error || "Test fehlgeschlagen");
      }
      status("Verbindung ok.", true);
    } catch (e) { status("Test fehlgeschlagen: " + e.message, false); }
    loadLiveStatus();
  }

  $("save").onclick = save;
  $("test").onclick = test;
  load();
  loadLiveStatus();
  setInterval(loadLiveStatus, 10000);
</script>
</body>
</html>

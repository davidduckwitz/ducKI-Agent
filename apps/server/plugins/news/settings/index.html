<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>News — Einstellungen</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 1.25rem; line-height: 1.5; }
  h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  p.hint { margin: 0 0 1rem; opacity: 0.75; font-size: 0.85rem; }
  label { display: block; margin: 0.9rem 0 0.3rem; font-weight: 600; font-size: 0.85rem; }
  select, input { width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; }
  .row { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
  button { padding: 0.5rem 0.9rem; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .primary { background: #2563eb; color: #fff; }
  #status { margin-top: 0.75rem; font-size: 0.85rem; min-height: 1.2em; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
</style>
</head>
<body>
  <h1>📰 News-Einstellungen</h1>
  <p class="hint">Standardwerte für den Nachrichtenabruf. Meldungen werden pro Tag und Quelle einmal geladen (Cache) und in der Plugin-Datenbank gespeichert.</p>

  <label for="default_source">Standard-Quelle</label>
  <select id="default_source">
    <option value="tagesschau">Tagesschau (DE)</option>
    <option value="tagesschau-ausland">Tagesschau Ausland (DE)</option>
    <option value="bbc">BBC (EN)</option>
    <option value="bbc-world">BBC World (EN)</option>
    <option value="spiegel">Spiegel (DE)</option>
  </select>

  <label for="default_count">Standard-Anzahl (1–30)</label>
  <input id="default_count" type="number" min="1" max="30" />

  <div class="row">
    <button class="primary" id="save">Speichern</button>
  </div>
  <div id="status"></div>

<script>
  const BASE = "/api/plugins/news";
  const $ = (id) => document.getElementById(id);
  const status = (msg, ok) => { const s = $("status"); s.textContent = msg || ""; s.className = ok ? "ok" : "err"; };

  async function load() {
    try {
      const res = await fetch(BASE + "/settings");
      const json = await res.json();
      const v = (json.data && json.data.values) || json.values || {};
      if (v.default_source) $("default_source").value = v.default_source;
      $("default_count").value = v.default_count != null ? v.default_count : 10;
    } catch (e) { status("Konnte Einstellungen nicht laden: " + e.message, false); }
  }

  async function save() {
    let count = parseInt($("default_count").value, 10);
    if (!Number.isFinite(count) || count < 1) count = 1;
    if (count > 30) count = 30;
    const values = { default_source: $("default_source").value, default_count: count };
    try {
      const res = await fetch(BASE + "/settings", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ values })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((json && (json.error || json.message)) || ("HTTP " + res.status));
      status("Gespeichert.", true);
    } catch (e) { status("Speichern fehlgeschlagen: " + e.message, false); }
  }

  $("save").onclick = save;
  load();
</script>
</body>
</html>

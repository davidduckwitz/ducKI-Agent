<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>News</title>
<script>const themeParams=new URLSearchParams(location.search);document.documentElement.dataset.theme=themeParams.get("theme")==="light"?"light":"dark";document.documentElement.dataset.accent=themeParams.get("accent")||"blue";</script>
<style>
  :root { color-scheme: light; --text: #14161b; --muted: #6b7280; --accent: #2563eb; --line: #0000001a; }
  :root[data-theme="dark"] { color-scheme: dark; --text: #eef0f5; --muted: #9aa3b2; --line: #ffffff1f; }
  :root[data-theme="dark"][data-accent="blue"] { --accent: #60a5fa; }
  :root[data-accent="violet"] { --accent: #8b5cf6; } :root[data-accent="green"] { --accent: #16a34a; }
  :root[data-accent="orange"] { --accent: #ea580c; } :root[data-accent="rose"] { --accent: #e11d48; }
  :root[data-accent="zinc"] { --accent: #71717a; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, sans-serif; color: var(--text); background: transparent; padding: 0.55rem 0.65rem; box-sizing: border-box; display: flex; flex-direction: column; gap: 0.45rem; overflow: hidden; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .head h2 { margin: 0; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .head .dt { font-size: 0.62rem; color: var(--muted); }

  .feature { position: relative; flex: 1; min-height: 76px; display: flex; align-items: center; }
  .card { transition: opacity 0.5s ease, transform 0.5s ease; opacity: 1; width: 100%; }
  .feature.fading .card { opacity: 0; transform: translateY(-6px); }
  .card .meta { display: flex; align-items: center; gap: 0.4rem; font-size: 0.66rem; color: var(--muted); margin-bottom: 0.2rem; }
  .card .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .dot.high { background: #ef4444; } .dot.med { background: #f59e0b; } .dot.low { background: #9ca3af; }
  .card .src { font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
  .card .ttl { font-size: 0.98rem; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .ttl a { color: inherit; text-decoration: none; }
  .card .ttl a:hover { text-decoration: underline; }

  .tickerwrap { position: relative; overflow: hidden; border-top: 1px solid var(--line); padding-top: 0.4rem; white-space: nowrap; }
  .ticker { display: inline-flex; white-space: nowrap; will-change: transform; animation: scroll linear infinite; }
  .ticker:hover { animation-play-state: paused; }
  .ticker .it { font-size: 0.74rem; color: var(--text); opacity: 0.85; padding: 0 0.5rem; }
  .ticker .it a { color: inherit; text-decoration: none; }
  .ticker .it .s { color: var(--accent); font-weight: 700; }
  .ticker .sep { color: var(--muted); opacity: 0.5; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .empty { font-size: 0.82rem; color: var(--muted); }
  @media (max-height: 70px) {
    body { padding: 0.25rem 0.5rem; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 0.5rem; }
    .head .dt, .feature { display: none; }
    .tickerwrap { border-top: 0; padding-top: 0; min-width: 0; }
  }
</style>
</head>
<body>
  <div class="head"><h2>📰 World Events</h2><span class="dt" id="dt"></span></div>
  <div class="feature" id="feature"><div class="card"><div class="empty">Lädt …</div></div></div>
  <div class="tickerwrap"><div class="ticker" id="ticker"></div></div>

<script>
  const INVOKE = "/api/plugins/news/invoke";
  const feature = document.getElementById("feature");
  const ticker = document.getElementById("ticker");
  const card = feature.querySelector(".card");
  let items = [], idx = 0, rotTimer = null;
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const shortTime = (v) => { const d = new Date(v); return isNaN(d) ? "" : d.toLocaleString("de-DE", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); };

  async function invoke(input) {
    const res = await fetch(INVOKE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tool: "news", input }) });
    const json = await res.json().catch(() => ({}));
    const payload = (json.data && json.data.result) || json.result || {};
    if (payload.error) throw new Error(payload.error);
    return payload;
  }

  function showFeature(i) {
    const a = items[i]; if (!a) return;
    const link = a.link ? '<a href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer">' + esc(a.title) + '</a>' : esc(a.title);
    card.innerHTML =
      '<div class="meta"><span class="dot ' + (a.alert || "low") + '"></span>' +
      '<span class="src">' + esc(a.source || "") + '</span><span>' + esc(shortTime(a.pubDate)) + '</span></div>' +
      '<div class="ttl">' + link + '</div>';
  }

  function rotate() {
    if (items.length < 2) return;
    feature.classList.add("fading");
    setTimeout(() => { idx = (idx + 1) % items.length; showFeature(idx); feature.classList.remove("fading"); }, 500);
  }

  function buildTicker() {
    const one = items.map((a) => {
      const label = '<span class="s">' + esc(a.source || "") + "</span> " + esc(a.title);
      const inner = a.link ? '<a href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer">' + label + "</a>" : label;
      return '<span class="it">' + inner + '</span><span class="sep">•</span>';
    }).join("");
    // Zweimal aneinander für nahtlose Endlosschleife (-50%).
    ticker.innerHTML = one + one;
    const secs = Math.max(24, items.length * 3.2);
    ticker.style.animationDuration = secs + "s";
  }

  async function load() {
    try {
      const r = await invoke({ action: "fetch", source: "all", count: 15 });
      items = (r.articles || []).slice(0, 15);
      document.getElementById("dt").textContent = r.date || "";
      if (items.length === 0) { card.innerHTML = '<div class="empty">Keine Meldungen.</div>'; ticker.innerHTML = ""; return; }
      idx = 0; showFeature(0); buildTicker();
      if (rotTimer) clearInterval(rotTimer);
      rotTimer = setInterval(rotate, 5000);
    } catch (e) {
      card.innerHTML = '<div class="empty">Fehler: ' + esc(e.message) + "</div>";
    }
  }

  load();
  // Alle 15 Min. Daten erneuern (dank Tages-Cache i. d. R. ohne Netzabruf).
  setInterval(load, 900000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einkaufsliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0f; --surface: #141419; --surface-2: #1b1b22; --surface-3: #22222b;
    --border: #292932; --border-strong: #383842; --text: #f4f4f5; --text-secondary: #d4d4d8; --muted: #a1a1aa;
    --primary: #22c55e; --primary-hover: #4ade80; --primary-soft: rgba(34, 197, 94, .16);
    --danger: #ef4444; --warning: #f59e0b;
    --shadow: 0 15px 50px rgba(0, 0, 0, .35); --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  .app { width: 100%; max-width: 900px; margin: 0 auto; padding: 20px 24px 40px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-icon { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #fff; font-size: 21px; background: linear-gradient(135deg, #22c55e, #4ade80); box-shadow: 0 8px 25px rgba(34, 197, 94, .35); flex-shrink: 0; }
  .brand-text h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.03em; }
  .brand-text p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; width: fit-content; }
  .tab { min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; }
  .tab.active { background: var(--primary-soft); color: var(--primary); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .add-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .add-row input { flex: 1; min-width: 120px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
  .add-row input.qty { flex: 0 0 80px; }
  .add-row input.unit { flex: 0 0 90px; }
  .primary-button { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--primary); background: var(--primary); color: #06210f; font-weight: 700; }
  .primary-button:hover { background: var(--primary-hover); }
  .ghost-button { min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .ghost-button:hover { background: var(--surface-3); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
  .row.checked { opacity: .5; }
  .row.checked .row-name { text-decoration: line-through; }
  .row-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border-strong); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; }
  .row-check.on { background: var(--primary); border-color: var(--primary); color: #06210f; font-weight: 800; }
  .row-name { flex: 1; font-weight: 600; font-size: 14px; }
  .row-qty { font-size: 12px; color: var(--muted); }
  .row-del { border: 0; background: transparent; color: var(--muted); font-size: 16px; padding: 4px; }
  .row-del:hover { color: var(--danger); }

  .row.low { border-color: rgba(245, 158, 11, .4); }
  .badge-low { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: rgba(245, 158, 11, .16); color: var(--warning); font-weight: 700; }
  .pantry-controls { display: flex; align-items: center; gap: 6px; }
  .mini-btn { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-3); color: var(--text); }

  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .toast-container { position: fixed; right: 20px; bottom: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
  .toast { min-width: 220px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🛒</div>
      <div class="brand-text"><h1>Einkaufsliste</h1><p>Liste &amp; Vorrat</p></div>
    </div>
  </header>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="list">Einkaufsliste</button>
    <button type="button" class="tab" data-tab="pantry">Vorrat</button>
  </div>

  <section id="listPane" class="card">
    <div class="add-row">
      <input type="text" id="itemName" placeholder="Artikel, z. B. Milch" />
      <input type="number" id="itemQty" class="qty" placeholder="Menge" step="0.1" />
      <input type="text" id="itemUnit" class="unit" placeholder="Einheit" />
      <button type="button" class="primary-button" id="addItemBtn">+ Hinzufügen</button>
      <button type="button" class="ghost-button" id="clearCheckedBtn">Abgehakte löschen</button>
    </div>
    <div class="list" id="itemsList"></div>
  </section>

  <section id="pantryPane" class="card" style="display:none">
    <div class="add-row">
      <input type="text" id="pantryName" placeholder="Artikel, z. B. Mehl" />
      <input type="number" id="pantryQty" class="qty" placeholder="Menge" step="0.1" />
      <input type="text" id="pantryUnit" class="unit" placeholder="Einheit" />
      <input type="number" id="pantryThreshold" class="qty" placeholder="Mindestbestand" step="0.1" />
      <button type="button" class="primary-button" id="setPantryBtn">+ Speichern</button>
    </div>
    <div class="list" id="pantryList"></div>
  </section>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const INVOKE_URL = "/api/plugins/shopping-list/invoke";
  const toastContainer = document.getElementById("toastContainer");

  async function invoke(input) {
    const res = await fetch(INVOKE_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool: "shopping_list", input })
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((json && (json.error || json.message)) || ("HTTP " + res.status));
    const payload = (json.data && json.data.result) || json.result || {};
    if (payload.error) throw new Error(payload.error);
    return payload;
  }

  function showToast(message) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;
    toastContainer.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 2500);
  }

  // Tabs
  const tabs = document.querySelectorAll(".tab");
  const listPane = document.getElementById("listPane");
  const pantryPane = document.getElementById("pantryPane");
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      tabs.forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      const isList = tab.dataset.tab === "list";
      listPane.style.display = isList ? "" : "none";
      pantryPane.style.display = isList ? "none" : "";
      if (!isList) loadPantry();
    });
  });

  // Shopping list
  async function loadItems() {
    const res = await invoke({ action: "list_items" });
    const container = document.getElementById("itemsList");
    container.innerHTML = "";
    if (!res.items.length) {
      container.innerHTML = '<div class="empty">Leer. Füge oben etwas hinzu.</div>';
      return;
    }
    res.items.forEach(function (item) {
      const row = document.createElement("div");
      row.className = "row" + (item.checked ? " checked" : "");
      const qtyText = [item.quantity, item.unit].filter(Boolean).join(" ");
      row.innerHTML =
        '<button type="button" class="row-check' + (item.checked ? " on" : "") + '">' + (item.checked ? "✓" : "") + "</button>" +
        '<span class="row-name">' + item.name + "</span>" +
        (qtyText ? '<span class="row-qty">' + qtyText + "</span>" : "") +
        '<button type="button" class="row-del">✕</button>';
      row.querySelector(".row-check").addEventListener("click", async function () {
        await invoke({ action: "check_item", id: item.id, checked: !item.checked });
        loadItems();
      });
      row.querySelector(".row-del").addEventListener("click", async function () {
        await invoke({ action: "remove_item", id: item.id });
        loadItems();
      });
      container.appendChild(row);
    });
  }

  document.getElementById("addItemBtn").addEventListener("click", async function () {
    const name = document.getElementById("itemName").value.trim();
    if (!name) return showToast("Bitte einen Namen eingeben.");
    const quantity = document.getElementById("itemQty").value;
    const unit = document.getElementById("itemUnit").value.trim();
    await invoke({ action: "add_item", name, quantity: quantity ? Number(quantity) : undefined, unit: unit || undefined });
    document.getElementById("itemName").value = "";
    document.getElementById("itemQty").value = "";
    document.getElementById("itemUnit").value = "";
    loadItems();
  });

  document.getElementById("clearCheckedBtn").addEventListener("click", async function () {
    await invoke({ action: "clear_checked" });
    loadItems();
  });

  // Pantry
  async function loadPantry() {
    const res = await invoke({ action: "list_pantry" });
    const container = document.getElementById("pantryList");
    container.innerHTML = "";
    if (!res.pantry.length) {
      container.innerHTML = '<div class="empty">Noch kein Vorrat erfasst.</div>';
      return;
    }
    res.pantry.forEach(function (item) {
      const row = document.createElement("div");
      row.className = "row" + (item.low ? " low" : "");
      const qtyText = [item.quantity, item.unit].filter(Boolean).join(" ");
      row.innerHTML =
        '<span class="row-name">' + item.name + "</span>" +
        '<span class="row-qty">' + qtyText + (item.low ? ' <span class="badge-low">niedrig</span>' : "") + "</span>" +
        '<div class="pantry-controls">' +
          '<button type="button" class="mini-btn" data-d="-1">−</button>' +
          '<button type="button" class="mini-btn" data-d="1">+</button>' +
        "</div>" +
        '<button type="button" class="row-del">✕</button>';
      row.querySelectorAll(".mini-btn").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          const delta = Number(btn.dataset.d);
          if (delta < 0) {
            const res2 = await invoke({ action: "consume_pantry", name: item.name, quantity: 1 });
            if (res2.addedToShoppingList) showToast(item.name + " ist knapp - zur Einkaufsliste hinzugefügt.");
          } else {
            await invoke({ action: "set_pantry", name: item.name, quantity: Number(item.quantity) + 1, unit: item.unit, low_threshold: item.low_threshold });
          }
          loadPantry();
        });
      });
      row.querySelector(".row-del").addEventListener("click", async function () {
        await invoke({ action: "remove_pantry", id: item.id });
        loadPantry();
      });
      container.appendChild(row);
    });
  }

  document.getElementById("setPantryBtn").addEventListener("click", async function () {
    const name = document.getElementById("pantryName").value.trim();
    if (!name) return showToast("Bitte einen Namen eingeben.");
    const quantity = Number(document.getElementById("pantryQty").value || 0);
    const unit = document.getElementById("pantryUnit").value.trim();
    const low_threshold = Number(document.getElementById("pantryThreshold").value || 0);
    await invoke({ action: "set_pantry", name, quantity, unit: unit || undefined, low_threshold });
    document.getElementById("pantryName").value = "";
    document.getElementById("pantryQty").value = "";
    document.getElementById("pantryUnit").value = "";
    document.getElementById("pantryThreshold").value = "";
    loadPantry();
  });

  await loadItems();
});
</script>
</body>
</html>

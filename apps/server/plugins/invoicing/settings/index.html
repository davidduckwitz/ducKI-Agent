<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rechnungen — Einstellungen</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 1.25rem; line-height: 1.5; }
  h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  p.hint { margin: 0 0 1rem; opacity: 0.75; font-size: 0.85rem; }
  label { display: block; margin: 0.9rem 0 0.3rem; font-weight: 600; font-size: 0.85rem; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  .row { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
  button { padding: 0.5rem 0.9rem; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .primary { background: #3b82f6; color: #fff; }
  #status { margin-top: 0.75rem; font-size: 0.85rem; min-height: 1.2em; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
</style>
</head>
<body>
  <h1>🧾 Rechnungen — Einstellungen</h1>
  <p class="hint">Diese Angaben erscheinen im Kopf jeder Rechnung.</p>

  <label for="company_name">Firmenname</label>
  <input id="company_name" type="text" />

  <label for="company_address">Firmenadresse</label>
  <textarea id="company_address" rows="3"></textarea>

  <label for="tax_id">Steuernummer / USt-IdNr.</label>
  <input id="tax_id" type="text" />

  <label for="iban">IBAN</label>
  <input id="iban" type="text" />

  <label for="invoice_prefix">Nummernkreis-Präfix</label>
  <input id="invoice_prefix" type="text" placeholder="RE" />

  <div class="row">
    <button class="primary" id="save">Speichern</button>
  </div>
  <div id="status"></div>

<script>
  const NAME = "invoicing";
  const BASE = "/api/plugins/" + NAME;
  const $ = (id) => document.getElementById(id);
  const status = (msg, ok) => { const s = $("status"); s.textContent = msg || ""; s.className = ok ? "ok" : "err"; };

  async function load() {
    try {
      const res = await fetch(BASE + "/settings");
      const json = await res.json();
      const v = (json.data && json.data.values) || json.values || {};
      if (v.company_name) $("company_name").value = v.company_name;
      if (v.company_address) $("company_address").value = v.company_address;
      if (v.tax_id) $("tax_id").value = v.tax_id;
      if (v.iban) $("iban").value = v.iban;
      $("invoice_prefix").value = v.invoice_prefix || "RE";
    } catch (e) { status("Konnte Einstellungen nicht laden: " + e.message, false); }
  }

  async function save() {
    const values = {
      company_name: $("company_name").value.trim(),
      company_address: $("company_address").value.trim(),
      tax_id: $("tax_id").value.trim(),
      iban: $("iban").value.trim(),
      invoice_prefix: $("invoice_prefix").value.trim() || "RE",
    };
    try {
      const res = await fetch(BASE + "/settings", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ values })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((json && (json.error || json.message)) || ("HTTP " + res.status));
      status("Gespeichert.", true);
    } catch (e) { status("Speichern fehlgeschlagen: " + e.message, false); }
  }

  $("save").onclick = save;
  load();
</script>
</body>
</html>

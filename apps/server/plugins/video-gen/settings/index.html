<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Gen — Einstellungen</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 1.25rem; line-height: 1.5; }
  h1 { font-size: 1.1rem; margin: 0 0 0.75rem; }
  p.hint { margin: 0 0 1rem; opacity: 0.75; font-size: 0.85rem; }
  label { display: block; margin: 0.9rem 0 0.25rem; font-weight: 600; font-size: 0.85rem; }
  label.checkbox { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
  label.checkbox input { width: auto; }
  input, select { width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  .row { display: flex; gap: 0.5rem; margin-top: 1.25rem; flex-wrap: wrap; }
  button { padding: 0.5rem 0.9rem; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .primary { background: #ec4899; color: #fff; }
  #status { margin-top: 0.75rem; font-size: 0.85rem; min-height: 1.2em; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
</style>
</head>
<body>
  <h1>🎬 Video Gen — Einstellungen</h1>
  <p class="hint">Standardmodell, Python-Pfad, Rechengeraet und - falls gebraucht - ein Hugging-Face-Zugriffstoken fuer Modelle, die ein angemeldetes/akzeptiertes Konto verlangen (z. B. HunyuanVideo, huggingface.co/settings/tokens).</p>

  <div id="form">Lade…</div>

  <div class="row">
    <button class="primary" id="save">Speichern</button>
  </div>
  <div id="status"></div>

<script>
  const NAME = "video-gen";
  const BASE = "/api/plugins/" + NAME;
  const formEl = document.getElementById("form");
  const statusEl = document.getElementById("status");
  let specs = [];

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function fieldHtml(spec) {
    const id = "f_" + spec.key;
    const label = spec.description || spec.key;
    if (spec.type === "boolean") {
      return `<label class="checkbox" for="${id}"><input type="checkbox" id="${id}"> ${escapeHtml(label)}</label>`;
    }
    if (spec.type === "select" && Array.isArray(spec.options)) {
      const opts = spec.options.map((o) => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
      return `<label for="${id}">${escapeHtml(label)}</label><select id="${id}"><option value="">- Standard${spec.default ? " (" + escapeHtml(spec.default) + ")" : ""} -</option>${opts}</select>`;
    }
    const inputType = spec.type === "secret" ? "password" : spec.type === "number" ? "number" : "text";
    return `<label for="${id}">${escapeHtml(label)}</label><input id="${id}" type="${inputType}" autocomplete="off">`;
  }

  async function load() {
    try {
      const res = await fetch(BASE + "/settings");
      const json = await res.json();
      if (!res.ok || !json.success) throw new Error((json && json.error) || ("HTTP " + res.status));
      specs = (json.data && json.data.specs) || [];
      const values = (json.data && json.data.values) || {};
      formEl.innerHTML = specs.map(fieldHtml).join("") || "<p>Dieses Plugin hat keine konfigurierbaren Einstellungen.</p>";
      for (const spec of specs) {
        const el = document.getElementById("f_" + spec.key);
        const v = values[spec.key];
        if (spec.type === "boolean") {
          el.checked = v === true || v === "true";
        } else if (spec.type === "secret") {
          el.placeholder = v === "***" ? "•••• (gesetzt - leer lassen = unveraendert)" : "••••";
        } else {
          el.value = v == null ? "" : String(v);
        }
      }
    } catch (e) {
      formEl.innerHTML = "";
      statusEl.textContent = "Konnte Einstellungen nicht laden: " + e.message;
      statusEl.className = "err";
    }
  }

  async function save() {
    const values = {};
    for (const spec of specs) {
      const el = document.getElementById("f_" + spec.key);
      if (!el) continue;
      if (spec.type === "boolean") {
        values[spec.key] = String(el.checked);
      } else if (spec.type === "secret") {
        if (el.value.trim()) values[spec.key] = el.value.trim();
        // left empty -> omit entirely, so an already-stored secret is left unchanged
      } else {
        values[spec.key] = el.value;
      }
    }
    try {
      const res = await fetch(BASE + "/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ values }),
      });
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || !json.success) throw new Error((json && json.error) || ("HTTP " + res.status));
      statusEl.textContent = "Gespeichert.";
      statusEl.className = "ok";
      await load();
    } catch (e) {
      statusEl.textContent = "Speichern fehlgeschlagen: " + e.message;
      statusEl.className = "err";
    }
  }

  document.getElementById("save").addEventListener("click", save);
  load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laufende Katze</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 800px;
            height: 400px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, #90EE90, #228B22);
            border-top: 3px solid #7CCD7C;
        }

        .cat {
            position: absolute;
            bottom: 100px;
            left: 50px;
            width: 80px;
            height: 60px;
            animation: run 2s infinite;
        }

        @keyframes run {
            0%, 100% {
                left: 50px;
                transform: scaleX(1);
            }
            50% {
                left: calc(100% - 130px);
                transform: scaleX(-1);
            }
        }

        /* Katzen-Body */
        .cat-body {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 50px;
            height: 30px;
            background: #FF8C00;
            border-radius: 15px;
            box-shadow: inset -2px -2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Katzen-Kopf */
        .cat-head {
            position: absolute;
            bottom: 30px;
            left: 45px;
            width: 30px;
            height: 32px;
            background: #FF8C00;
            border-radius: 50% 50% 50% 50%;
            box-shadow: inset -2px -2px 5px rgba(0, 0, 0, 0.2);

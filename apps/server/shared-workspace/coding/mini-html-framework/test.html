<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini HTML Framework</title>
    <script src="./core.js" type="module"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        #root {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .title {
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
        }

        .card {
            padding: 20px;
            border-radius: 8px;
            background: #f9f9f9;
            border: 1px solid #eee;
            margin: 15px 0;
        }

        .user-card {
            border: 2px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
            background: #eef6ff;
            margin-top: 20px;
        }

        .user-card h3 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
        }

        .status-online {
            color: #28a745;
            font-weight: bold;
        }

        .status-offline {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="root">Lade Framework...</div>
    <script type="module">
        import HTMLRenderer from './core.js';

        const renderer = new HTMLRenderer();

        // Beispiel für eine Komponente mit Status-Logik
        renderer.registerComponent('user-card', {
            render: (data) => {
                const statusClass = data.active ? 'status-online' : 'status-offline';
                const statusText = data.active ? 'Online' : 'Offline';
                
                return `<div class="user-card">
                            <h3>Benutzer: {{name}}</h3>
                            <p>Status: <span class="${statusClass}">${statusText}</span></p>
                        </div>`;
            }
        });

        // Deine gewünschte JSON-Struktur mit Verschachtelung (Nested Structures)
        const jsonLayout = [
            {
                "html_tag": "h1", 
                "content": "Willkommen bei {{appName}}", 
                "class": "title"
            },
            {
                "html_tag": "div", 
                "class": "card",
                "children": [
                    {
                        "html_tag": "p", 
                        "content": "Dies ist ein Beispiel-Element.", 
                        "style": "font-weight: bold;"
                    },
                    {
                        "html_tag": "ul",
                        "children": [
                            { "html_tag": "li", "content": "Unterpunkt 1" },
                            { "html_tag": "li", "content": "Unterpunkt 2" }
                        ]
                    }
                ]
            },
            {
                "html_tag": "div",
                "data-component": "user-card",
                "content": "Nutzerdaten aus JSON"
            }
        ];

        // Dynamische Daten
        const data = {
            appName: "DuckiNode Framework",
            active: true,
            name: "Max Mustermann"
        };

        // Rendering ausführen
        renderer.renderFromJson(jsonLayout, data, '#root');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallo Dave</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #display-container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 2.5rem;
        }
    </style>
</head>
<body>
    <div id="display-container">
        <h1 id="date-time-display">Lade Datum...</h1>
    </div>
    <script>
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };\n            const dateString = now.toLocaleDateString('de-DE', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });\n            const timeString = now.toLocaleTimeString('de-DE', {\n                hour: '2-digit',
                minute: '2-digit'
            });\n            document.getElementById('date-time-display').innerText = `heute ist ${dateString} ${timeString}`;\n        }

        // Update every second
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globaler Zeitplan & Weltuhr</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #globe-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 2 / 1;
            /* Hintergrundbild der Weltkarte */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/World_map_-_low_resolution.svg/2560px-World_map_-_low_resolution.svg.png');
            background-size: cover;
            background-position: center;
            border-radius: 1rem;
            overflow: hidden;
        }
        #orb-marker {
            transition: cx 0.5s ease-in-out, cy 0.5s ease-in-out; 
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch">
        
        <!-- Linke Spalte: Uhr & Steuerung -->
        <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-800 flex flex-col justify-between space-y-8 transition-all duration-500 hover:border-blue-500/50">
            <div class="text-center">
                <h1 class="text-xs font-bold uppercase tracking-[0.3em] text-blue-500 mb-4">Globaler Zeit-Monitor</h1>
                
                <!-- Uhr-Anzeige -->
                <div id="clock-display" class="text-6xl md:text-7xl font-mono font-black text-white py-2 drop-shadow-[0_0_25px_rgba(59,130,246,0.4)]">
                    00:00:00
                </div>
                <div class="text-slate-500 text-sm mt-2 uppercase tracking-widest">Aktuelle Zeit</div>
            </div>
            
            <div class="space-y-4">
                <label for="timezone-select" class="block text-sm font-medium text-slate-400">Zeitzone wählen</label>
                <select id="timezone-select" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <!-- Wird per JS gefüllt -->
                </select>
            </div>
        </div>

        <!-- Rechte Spalte: Visuelle Weltkarte -->
        <div class="flex flex-col items-center justify-center space-y-6 bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-800">
            <h2 class="text-xl font-bold text-white">Visuelle Position</h2>
            <div id="globe-container" class="border border-slate-700 shadow-inner">
                <svg viewBox="0 0 200 100" class="w-full h-full">
                    <!-- Der Marker bewegt sich auf der statischen Karte -->
                    <circle id="orb-marker" cx="100" cy="50" r="5" fill="#3b82f6" filter="drop-shadow(0 0 5px #3b82f6)" />
                </svg>
            </div>
            <div id="location-label" class="text-lg font-semibold text-blue-400">Globaler Standard</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

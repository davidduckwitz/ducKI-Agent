<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DucKI Node</title>
<!--
  Startup splash for the Tauri desktop shell (apps/tauri-desktop, window label "splash").
  Self-contained on purpose: it must render instantly, before the agent (and therefore the SPA's
  API) exists. Progress comes from Rust via the "startup://progress" event plus an initial
  get_startup_status pull. Opened in a normal browser it runs a demo sequence (?error=1 shows the
  failure state) so the design can be previewed without building the desktop app.
-->
<style>
  :root {
    --bg-1: #0a0f1e;
    --bg-2: #121b36;
    --line: rgba(148, 163, 214, 0.16);
    --text: #eef2ff;
    --muted: #9aa6c8;
    --duck: #ffce31;
    --duck-dark: #f2b705;
    --beak: #ff8a1e;
    --water: #3b82f6;
    --ok: #34d399;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }
  .card {
    position: absolute;
    inset: 10px;
    border-radius: 22px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 18% 110%, rgba(59, 130, 246, 0.28), transparent 60%),
      radial-gradient(80% 70% at 100% 0%, rgba(255, 206, 49, 0.12), transparent 60%),
      linear-gradient(160deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: 1fr auto;
    animation: card-in 480ms cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
  }
  .card.leaving { animation: card-out 380ms ease-in both; }
  @keyframes card-in { from { opacity: 0; transform: scale(0.94) translateY(10px); } }
  @keyframes card-out { to { opacity: 0; transform: scale(1.03); } }

  /* ---------- night sky ---------- */
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: 0.2;
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
  }
  @keyframes twinkle { 50% { opacity: 0.9; transform: scale(1.4); } }

  /* ---------- pond + duck ---------- */
  .pond {
    position: relative;
    overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 54px;
  }
  .water {
    position: absolute; left: 0; right: 0; bottom: 0; height: 92px;
    background: linear-gradient(180deg, rgba(59, 130, 246, 0.0), rgba(59, 130, 246, 0.22));
  }
  .wave {
    position: absolute; left: -50%; width: 200%; height: 16px; bottom: 70px;
    background: radial-gradient(12px 7px at 12px 0, transparent 11px, rgba(96, 165, 250, 0.45) 12px) repeat-x;
    background-size: 24px 16px;
    animation: drift 5s linear infinite;
    opacity: 0.55;
  }
  .wave.w2 { bottom: 52px; opacity: 0.3; animation-duration: 8s; animation-direction: reverse; }
  .wave.w3 { bottom: 34px; opacity: 0.18; animation-duration: 11s; }
  @keyframes drift { to { transform: translateX(24px); } }

  .duck-wrap { position: relative; width: 190px; height: 190px; z-index: 2; margin-bottom: -30px; margin-top: 60px; }
  .duck { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.35)); }
  .duck .body-group { transform-origin: 32px 44px; animation: bob 2.6s ease-in-out infinite; }
  .duck .wing { transform-origin: 28px 36px; }
  .duck .eye { transform-origin: 45px 21px; animation: blink 4.4s infinite; }
  .working .duck .wing { animation: paddle 0.9s ease-in-out infinite; }
  .working .duck .body-group { animation: swim 1.8s ease-in-out infinite; }
  .ready .duck .body-group { animation: hop 0.9s cubic-bezier(0.3, 1.6, 0.5, 1) 2; }
  .ready .duck .wing { animation: flap 0.22s ease-in-out 8; }
  .error .duck .body-group { animation: none; transform: rotate(-160deg) translate(0, -8px); transition: transform 700ms cubic-bezier(0.34, 0.6, 0.64, 1); }
  .error .duck .eye { animation: none; }
  .error .duck .eye circle { display: none; }
  .error .duck .eye .x { display: block; }
  .duck .eye .x { display: none; }
  @keyframes bob { 50% { transform: translateY(-3px) rotate(-1.5deg); } }
  @keyframes swim { 0%, 100% { transform: translateX(-2px) rotate(-2deg); } 50% { transform: translateX(2px) translateY(-2px) rotate(2deg); } }
  @keyframes hop { 40% { transform: translateY(-16px) rotate(-6deg); } }
  @keyframes paddle { 50% { transform: rotate(-14deg); } }
  @keyframes flap { 50% { transform: rotate(-38deg) translateY(-2px); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

  .ripple {
    position: absolute; left: 50%; bottom: 20px; width: 150px; height: 26px; margin-left: -75px;
    border: 2px solid rgba(147, 197, 253, 0.5); border-radius: 50%;
    animation: ripple 2.6s ease-out infinite; opacity: 0; z-index: 1;
  }
  .ripple.r2 { animation-delay: 1.3s; }
  @keyframes ripple { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }

  .bubble {
    position: absolute; top: 4px; right: -6px; z-index: 3;
    background: #fff; color: #1f2937; font-weight: 700; font-size: 14px;
    padding: 6px 11px; border-radius: 14px 14px 14px 4px;
    transform: scale(0); transform-origin: bottom left;
    transition: transform 300ms cubic-bezier(0.3, 1.6, 0.5, 1);
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
  }
  .bubble.show { transform: scale(1); }

  /* ---------- content ---------- */
  .content { position: relative; padding: 30px 32px 10px 8px; display: flex; flex-direction: column; min-width: 0; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin: 0; font-size: 30px; letter-spacing: -0.5px; font-weight: 750; }
  .brand h1 span { color: var(--duck); }
  .version { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
  .tagline { margin: 6px 0 18px; color: var(--muted); font-size: 13.5px; }

  .features { position: relative; flex: 1; min-height: 150px; }
  .feature {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-content: start;
    padding: 18px; border-radius: 16px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line);
    opacity: 0; transform: translateX(24px);
    transition: opacity 500ms ease, transform 500ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .feature.active { opacity: 1; transform: none; }
  .feature.gone { opacity: 0; transform: translateX(-24px); }
  .feature .icon {
    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px;
    background: linear-gradient(135deg, rgba(255, 206, 49, 0.22), rgba(255, 138, 30, 0.12));
    border: 1px solid rgba(255, 206, 49, 0.3);
  }
  .feature h2 { margin: 2px 0 6px; font-size: 16.5px; }
  .feature p { margin: 0; color: #c7d0ea; font-size: 13.5px; line-height: 1.5; }
  .feature .usecase { margin-top: 10px; font-size: 12.5px; color: var(--duck); font-style: italic; }
  .dots { display: flex; gap: 6px; margin: 12px 0 0; }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.18); transition: all 300ms; }
  .dot.active { width: 18px; background: var(--duck); }

  /* ---------- progress ---------- */
  .footer { grid-column: 1 / -1; padding: 14px 28px 20px; border-top: 1px solid var(--line); background: rgba(5, 8, 18, 0.35); }
  .steps { display: flex; gap: 8px; margin-bottom: 10px; }
  .step {
    flex: 1; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden;
  }
  .step i {
    flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2);
    display: grid; place-items: center; font-style: normal; font-size: 10px;
  }
  .step.current { color: var(--text); }
  .step.current i { border-color: var(--duck); box-shadow: 0 0 0 3px rgba(255, 206, 49, 0.18); animation: pulse 1.2s infinite; }
  .step.done { color: #cfe9dc; }
  .step.done i { background: var(--ok); border-color: var(--ok); color: #05281b; }
  .step.done i::after { content: "✓"; font-weight: 700; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 206, 49, 0.05); } }

  .bar { position: relative; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .bar .fill {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background: linear-gradient(90deg, var(--duck-dark), var(--duck), #ffe79a);
    border-radius: inherit; transition: width 380ms ease;
  }
  .bar .fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    animation: shine 1.4s linear infinite; transform: translateX(-100%);
  }
  @keyframes shine { to { transform: translateX(100%); } }
  .status-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  #message { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex: none; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; color: #c7d0ea; opacity: 0; transition: opacity 400ms; }
  .chip.show { opacity: 1; }
  .chip b { color: var(--duck); font-weight: 650; }

  /* ---------- error ---------- */
  .error-panel { display: none; }
  .error .features, .error .dots { display: none; }
  .error .error-panel { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
  .error-panel h2 { margin: 0; font-size: 17px; color: var(--err); }
  .error-panel pre {
    margin: 0; flex: 1; min-height: 0; overflow: auto; user-select: text;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(248, 113, 113, 0.3); border-radius: 12px;
    padding: 10px 12px; font: 11.5px/1.45 "Cascadia Mono", Consolas, monospace; color: #fecaca; white-space: pre-wrap;
  }
  .actions { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 10px; padding: 8px 14px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.06); color: var(--text);
  }
  button:hover { background: rgba(255,255,255,0.12); }
  button.primary { background: var(--duck); color: #1f1600; border-color: var(--duck); }
  button.primary:hover { background: #ffd95c; }
  .error .bar .fill { background: var(--err); }
  .error .step.current i { border-color: var(--err); box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.2); animation: none; }
  .error .step.current { color: #fecaca; }
  .error .bar .fill::after { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="card working" id="card" data-tauri-drag-region>
  <div class="stars" id="stars"></div>

  <div class="pond" data-tauri-drag-region>
    <div class="water"></div>
    <div class="wave"></div><div class="wave w2"></div><div class="wave w3"></div>
    <div class="ripple"></div><div class="ripple r2"></div>
    <div class="duck-wrap">
      <div class="bubble" id="bubble">Quak!</div>
      <svg class="duck" viewBox="0 0 64 64" aria-label="DucKI">
        <g class="body-group">
          <path d="M14 40 Q6 38 8 46 Q12 47 17 43 Z" fill="#F2B705" />
          <ellipse cx="30" cy="42" rx="18" ry="14" fill="#FFCE31" />
          <ellipse cx="27" cy="47" rx="11" ry="6" fill="#FFE07A" opacity="0.55" />
          <g class="wing"><path d="M27 33 Q40 30 39 44 Q31 45 25 40 Z" fill="#F2B705" /></g>
          <circle cx="42" cy="24" r="11" fill="#FFCE31" />
          <circle cx="47" cy="27" r="2.4" fill="#FF9DB0" opacity="0.5" />
          <path d="M50 22 L60 25 L50 29 Z" fill="#FF8A1E" />
          <g class="eye">
            <circle cx="45" cy="21" r="2.2" fill="#22303C" />
            <circle cx="45.8" cy="20.2" r="0.7" fill="#fff" />
            <path class="x" d="M43.4 19.4 L46.6 22.6 M46.6 19.4 L43.4 22.6" stroke="#22303C" stroke-width="1.3" stroke-linecap="round" />
          </g>
        </g>
      </svg>
    </div>
  </div>

  <div class="content" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <h1 data-tauri-drag-region>Duc<span>KI</span> Node</h1>
      <span class="version" id="version">Desktop</span>
    </div>
    <p class="tagline" id="tagline" data-tauri-drag-region>Dein lokaler KI-Agent wird geweckt …</p>

    <div class="features" id="features"></div>
    <div class="dots" id="dots"></div>

    <div class="error-panel">
      <h2>DucKI ist ins Wasser gefallen 🫧</h2>
      <pre id="error-text"></pre>
      <div class="actions">
        <button class="primary" id="btn-retry">Erneut versuchen</button>
        <button id="btn-logs">Logs öffnen</button>
        <button id="btn-quit">Beenden</button>
      </div>
    </div>
  </div>

  <div class="footer" data-tauri-drag-region>
    <div class="steps" id="steps"></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status-row">
      <span id="message">Starte …</span>
      <span class="chips">
        <span class="chip" id="chip-skills"><b>0</b> Skills</span>
        <span class="chip" id="chip-plugins"><b>0</b> Plugins</span>
        <span class="chip" id="chip-port">Port <b>–</b></span>
      </span>
    </div>
  </div>
</div>

<script src="desktop-splash.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#030712" />
    <title>DucKI Agent</title>
    <link rel="icon" type="image/svg+xml" href="/duck.svg" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("ducki.theme.mode") || "dark";
          var accent = localStorage.getItem("ducki.theme.accent") || "blue";
          var resolvedDark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", resolvedDark);
          root.setAttribute("data-accent", accent);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/boot.css" />
  </head>
  <body class="bg-background text-foreground">
    <div id="initial-loader" aria-live="polite" aria-busy="true">
      <div class="initial-loader-content">
        <div class="initial-loader-spinner" aria-hidden="true"></div>
        <div>DucKI wird geladen...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Nginx Configuration für https://ducki-ai-agent.davidduckwitz.de/
# Mit automatischer HTTP → HTTPS Umleitung

# ===== HTTP Redirect (Port 80) =====
server {
    listen 80;
    listen [::]:80;
    server_name ducki-ai-agent.davidduckwitz.de www.ducki-ai-agent.davidduckwitz.de;

    # Redirect all HTTP to HTTPS
    return 301 https://ducki-ai-agent.davidduckwitz.de$request_uri;

    # Let's Encrypt Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ===== HTTPS Configuration (Port 443) =====
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ducki-ai-agent.davidduckwitz.de www.ducki-ai-agent.davidduckwitz.de;

    # Remove www subdomain
    if ($server_name = "www.ducki-ai-agent.davidduckwitz.de") {
        return 301 https://ducki-ai-agent.davidduckwitz.de$request_uri;
    }

    root /var/www/ducki-landing;
    index index.html index.php;

    # ===== SSL CERTIFICATES =====
    ssl_certificate /etc/letsencrypt/live/ducki-ai-agent.davidduckwitz.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ducki-ai-agent.davidduckwitz.de/privkey.pem;

    # ===== SSL CONFIGURATION =====
    # Modern SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/ducki-ai-agent.davidduckwitz.de/chain.pem;

    # ===== SECURITY HEADERS =====
    # HSTS - Force HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:;" always;

    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ===== PERFORMANCE HEADERS =====
    # Static files - Cache for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # HTML - Cache 1 day
    location ~* \.(html)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # JSON data files - No cache (always fresh)
    location ~* \.json$ {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ===== GZIP COMPRESSION =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ===== API ROUTING =====
    location /api {
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # ===== PHP PROCESSING =====
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        include fastcgi_params;
    }

    # ===== DENY ACCESS TO SENSITIVE FILES =====
    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    location ~ /composer\.(json|lock) {
        deny all;
    }

    # ===== DEFAULT ROUTING =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== ERROR PAGES =====
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # ===== LOGGING =====
    access_log /var/log/nginx/ducki-agent-access.log;
    error_log /var/log/nginx/ducki-agent-error.log warn;
}

